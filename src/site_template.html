/* ── Decision Trace 加總驗算（門檻④ 的可見化）─────────────────────────────
   逐筆 ΔX／ΔY 站上一直印著，但從來沒有把它們加起來。門檻④（上週座標 ＋ Σ位移
   ＝ 本週宣告座標）先前只存在於 data/week_schema.json 的文件裡——評審拿計算機
   加一遍會得到什麼，我們自己沒有先擺出來。
   這是 AI 判定唯一可被讀者當場驗算的地方，所以它該在畫面上，不該在文件裡。 */
function traceSum(i){
  const w=DATA.weeks[i], dt=w.decisionTrace||[];
  if(!dt.length)return '';
  const p=i>0?DATA.weeks[i-1]:null;
  const sx=dt.reduce((s,t)=>s+(+t.xDelta||0),0), sy=dt.reduce((s,t)=>s+(+t.yDelta||0),0);
  const r3=n=>Math.round(n*1000)/1000;
  const row=(k,x,y,cls)=>`<tr class="${cls||''}"><td>${k}</td>`
    +`<td class="num">${x===null?'—':fmt(x)}</td><td class="num">${y===null?'—':fmt(y)}</td></tr>`;
  if(!p) return `<div class="tsum"><b>逐筆位移加總</b>
    <table class="tsum-t"><tbody>
      ${row('本期 Σ位移',r3(sx),r3(sy))}
      ${row('宣告座標',w.xy.x,w.xy.y,'cur')}
    </tbody></table>
    <p class="tsum-n">W1 為基準週，無上一期座標可相加，故本期不做加總驗算。</p></div>`;
  const ex=r3(p.xy.x+sx), ey=r3(p.xy.y+sy);
  const ok=Math.abs(ex-w.xy.x)<1e-9&&Math.abs(ey-w.xy.y)<1e-9;
  return `<div class="tsum${ok?'':' bad'}"><b>逐筆位移加總</b>
    <span class="tsum-q">上面每一筆的 ΔX／ΔY 加起來，應該正好等於本週宣告座標</span>
    <table class="tsum-t"><tbody>
      ${row('上期宣告座標（W'+p.week+'）',p.xy.x,p.xy.y)}
      ${row('＋ 本期 Σ位移（'+dt.length+' 筆）',r3(sx),r3(sy))}
      ${row('＝ 推得',ex,ey)}
      ${row('本期宣告座標',w.xy.x,w.xy.y,'cur')}
    </tbody></table>
    <p class="tsum-n">${ok
      ?'✓ 相符。'
      :'✗ 不吻合。差 ΔX '+fmt(r3(ex-w.xy.x))+'、ΔY '+fmt(r3(ey-w.xy.y))+'——此為缺陷，不應出現。'}</p></div>`;
}

/* ── 現場判定（判定鏈第一段的示範）───────────────────────────────────────
   ⚠ 這是全站唯一沒有對照組可自動比對的東西——模型現場講什麼就是什麼。
   因此三件事必須做到：① 標示「現場生成、未經覆核、不屬於本週報告」
   ② 選已收錄事件時，把當時的判定並排出來讓人自己比 ③ 明講 AI 只看得到這一則。
   不做這三件，它就從「示範可稽核性」變成「一個無法驗證的 AI 演出」。 */
/* 比對前先剝掉【…】——補記事件的 trace 標題帶著一長串揭露文字（「【補記事件：原始
   日期…依 week_schema 補記事件處理規則…】」），那是揭露不是識別，留著會把重疊度
   稀釋到對不上（實測 W10 事件 7 由 0.17 升到可對照）。 */
const jdClean=s=>deEnt(String(s||'')).replace(/【[^】]*】/g,'').trim();
function jdSim(a,b){            /* 2-gram 重疊度，用來把事件對回它的 decisionTrace */
  const g=s=>{const o=new Set();const t=jdClean(s);for(let i=0;i<t.length-1;i++)o.add(t.slice(i,i+2));return o};
  const A=g(a),B=g(b);if(!A.size||!B.size)return 0;
  let n=0;A.forEach(x=>{if(B.has(x))n++});
  return 2*n/(A.size+B.size);
}
function wireJudge(i){
  const box=$('#jd'); if(!box)return;
  const w=DATA.weeks[i], pick=$('#jdpick'), ta=$('#jdtext'), out=$('#jdout'), go=$('#jdgo');
  const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  pick.onchange=()=>{
    out.innerHTML='';
    if(pick.value===''){ta.value='';return}
    const e=w.events[+pick.value];
    ta.value=deEnt(e.title)+'。'+deEnt(e.summary||'');
  };
  go.onclick=async()=>{
    const q=ta.value.trim(); if(!q){ta.focus();return}
    const ep=(window.SCAI_AI_CONFIG||{}).endpoint||'';
    if(!ep){out.innerHTML='<div class="jd-err">未設定 AI 端點，現場判定不可用。</div>';return}
    go.disabled=true; out.innerHTML='<div class="jd-wait">AI 判定中…</div>';
    let tm=null;
    try{
      const ctl=new AbortController(); tm=setTimeout(()=>ctl.abort(),20000);
      const r=await fetch(ep,{method:'POST',headers:{'content-type':'application/json'},signal:ctl.signal,
        body:JSON.stringify({mode:'judge',question:q})});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json();
      const u=j.usage||{};
      let html='<div class="jd-cols"><div class="jd-col"><h4>AI 現場判定</h4>'
        +'<pre class="jd-pre">'+esc(j.answer)+'</pre>'
        +'<div class="jd-meta">模型 '+esc(j.model||'AI')+'｜in '+(u.input_tokens??'—')
        +'／out '+(u.output_tokens??'—')+' tokens</div></div>';
      /* 對照組：只有選了已收錄事件才有。自己貼的那段沒有正本可比，就不假裝有。 */
      if(pick.value!==''){
        const e=w.events[+pick.value];
        const dt=(w.decisionTrace||[]);
        let best=null,bs=0;
        dt.forEach(t=>{const s=jdSim(deEnt(t.event),deEnt(e.title));if(s>bs){bs=s;best=t}});
        html+='<div class="jd-col"><h4>當時的判定'+(bs<0.2?'（對不到，本則無決策軌跡）':'')+'</h4>';
        if(best&&bs>=0.2){
          html+='<pre class="jd-pre">X：'+fmt(+best.xDelta||0)+'\nY：'+fmt(+best.yDelta||0)
            +'\nKDF：'+((best.kdfChanges||[]).map(k=>'#'+k.id+' '+deEnt(k.name)+' '+k.from+'→'+k.to).join('、')||'不調整')
            +'</pre><div class="jd-meta">'+esc((best.kdfChanges||[]).map(k=>deEnt(k.reason||'')).join(' / ').slice(0,180))+'</div>';
        }else{
          html+='<div class="jd-meta">此事件未對應到任何 decisionTrace 條目——補記事件與純記錄性事件（如「本週無天災通報」）本來就不產生位移。</div>';
        }
        html+='</div>';
      }
      out.innerHTML=html+'</div>';
    }catch(err){
      out.innerHTML='<div class="jd-err">判定失敗：'+esc(err&&err.name==='AbortError'?'逾時（20 秒）':String(err&&err.message||err))
        +'。免費額度用罄或斷線時會出現此訊息；本區失效不影響站上任何既有資料。</div>';
    }finally{ if(tm)clearTimeout(tm); go.disabled=false; }
  };
}

/* ── 規則模擬器：以 JS 重跑 plan_engine 的觸發判定 ──────────────────────────
   條件三型別（axis／kdf／keyword）與 AND/OR 完全比照 src/plan_engine.py 的
   check()／evaluate()。KDF 與關鍵字維持該週實際值——它們來自事件內容，不是
   雙軸的函數，跟著滑桿動就是造假。
   ⚠ 一致性自檢：滑桿回到本週實際座標時，算出的觸發集合必須等於報告中的
   firedPlaybooks。不相等就在面板上明說「與引擎不一致」並列出兩邊——寧可自曝，
   也不讓一個會說謊的模擬器上台。 */
/* 否定子句剔除：與 plan_engine.strip_negated() 逐字對齊。兩邊都改才算改完——
   只改一邊會讓自檢在每一週都報不一致。 */
const SIMNEG=['無','未','沒有'], SIMNEG_OK=['無晶圓廠','無塵室','無人','未來'];
/* 已知且刻意保留的差異。新增一筆等於承認一次「當時算錯了但不回頭改」，
   所以每一筆都要寫清楚是哪次修正、為什麼不重算。空的才是正常狀態。 */
const SIM_KNOWN={
  10:{drop:['PB-07'],
      why:'引擎於 2026-08-20 修掉否定判讀（原本把「本週無天災、停電或缺水通報」讀成命中天災）。'
        +'W10 紀錄早於該修正，依 append-only 未回頭改寫，僅對 W11 起生效。'}
};
function simStripNeg(t){
  return t.split(/[。！？；\n，,]/).filter(cl=>{
    let probe=cl; SIMNEG_OK.forEach(w=>{probe=probe.split(w).join('')});
    return !SIMNEG.some(n=>probe.indexOf(n)>=0);
  }).join(' ');
}
function simText(w){                       // 對齊 plan_engine.week_text()
  const p=[w.scenarioDesc||''];
  (w.events||[]).forEach(e=>p.push(e.title||'',e.summary||''));
  (w.decisionTrace||[]).forEach(t=>{p.push(t.event||'');(t.keywords||[]).forEach(k=>p.push(k))});
  (w.riskRadar||[]).forEach(r=>p.push(r.risk||'',r.signal||''));
  return simStripNeg(p.join(' '));
}
const SIMCMP={'<=':(a,b)=>a<=b,'>=':(a,b)=>a>=b,'<':(a,b)=>a<b,'>':(a,b)=>a>b,'==':(a,b)=>a===b};
function simCheck(c,xy,w,text){
  if(c.type==='axis'){const v=xy[c.axis];
    return[SIMCMP[c.op](v,c.value),`${c.axis.toUpperCase()}=${fmt(v)} ${c.op} ${c.value}`]}
  if(c.type==='kdf'){const v=w.w[c.id-1];
    return[SIMCMP[c.op](v,c.value),`KDF#${c.id}=${v} ${c.op} ${c.value}`]}
  if(c.type==='keyword'){const hit=(c.any||[]).filter(k=>text.indexOf(k)>=0);
    return[hit.length>0,hit.length?'命中：'+hit.join('、'):'無命中關鍵字']}
  return[false,'未知條件'];
}
function simEval(xy,w,text){
  return Object.keys(DATA.triggers).sort().map(id=>{
    const t=DATA.triggers[id];
    const rs=(t.conditions||[]).map(c=>simCheck(c,xy,w,text));
    return {id,title:t.title,conds:rs,
      ok:(t.logic||'AND')==='AND'?rs.every(r=>r[0]):rs.some(r=>r[0])};
  });
}
/* 參數要用 render(i) 的 i，不可讀全域 cur——cur 是 go() 設的，render() 不設。
   直接呼叫 render(i) 逐週驗證時 cur 會停在上一次的值，面板整組拿錯週次的資料，
   而自檢因為兩邊都拿到同一週而顯示「一致」——一個看起來全綠的假驗證。
   （同一個坑在 go() 的 setTimeout 上踩過一次，見金庫「非同步包裝使逐項驗證失真」。） */
function wireSim(i){
  const box=$('#sim'); if(!box||!DATA.triggers)return;
  const w=DATA.weeks[i], text=simText(w), real={x:w.xy.x,y:w.xy.y};
  const sx=$('#simx'), sy=$('#simy');
  const draw=()=>{
    const xy={x:+sx.value,y:+sy.value};
    $('#simxv').textContent=fmt(xy.x); $('#simyv').textContent=fmt(xy.y);
    /* 象限判定照凍結正本：左上 Crossroads、右上 Spring、右下 Adaptation、左下 Inferno */
    $('#simscen').innerHTML='情境：<b>'+(xy.x>=0
      ?(xy.y>=0?'Spring 全球共榮的盛夏':'Adaptation 孤島韌性突圍')
      :(xy.y>=0?'Crossroads 溫室裡的舞者':'Inferno 末日求生戰役'))+'</b>';
    const res=simEval(xy,w,text);
    $('#simout').innerHTML=res.map(r=>`<div class="sim-r${r.ok?' on':''}">`
      +`<i>${r.ok?'✓':'✗'}</i><b>${r.id}</b><span>${r.title}</span>`
      +`<em>${r.conds.map(c=>(c[0]?'✓ ':'✗ ')+c[1]).join('　·　')}</em></div>`).join('');
    const mineA=res.filter(r=>r.ok).map(r=>r.id).sort(), mine=mineA.join('、');
    const engA=(((w.companyPlan||{}).firedPlaybooks)||[]).map(f=>f.id).sort(), eng=engA.join('、');
    const atReal=Math.abs(xy.x-real.x)<1e-9&&Math.abs(xy.y-real.y)<1e-9;
    const chk=$('#simchk');
    /* 兩種不一致要分開講，它們的意義完全相反：
       ① 已知且刻意保留 —— 該週紀錄產生於某次引擎修正之前，依 append-only 不回頭
          改寫已發佈週次。這是誠實的結果，該揭露不該警告。
       ② 其他任何不一致 —— 那是模擬器抄錯了引擎，是真缺陷，維持警告。
       不設這個區分的話，B 方案（不回頭重算）會讓面板在該週長期顯示紅字，
       久了就沒有人再看它——一個永遠在響的警報等於沒有警報。 */
    const kn=SIM_KNOWN[w.week];
    const isKnown=kn&&engA.filter(x=>mineA.indexOf(x)<0).join('、')===kn.drop.join('、')
                    &&mineA.filter(x=>engA.indexOf(x)<0).length===0;
    chk.textContent=!atReal?'':(mine===eng?'✓ 與本週報告的觸發結果一致'
      :isKnown?'已知差異：報告多 '+kn.drop.join('、')+'——'+kn.why
      :'⚠ 與引擎不一致：模擬得 '+(mine||'無')+'，報告為 '+(eng||'無'));
    chk.className='sim-chk'+(atReal&&mine!==eng&&!isKnown?' bad':'')
      +(atReal&&isKnown?' note':'');
  };
  const reset=()=>{sx.value=real.x;sy.value=real.y;draw()};
  sx.oninput=draw; sy.oninput=draw; $('#simreset').onclick=reset;
  reset();
}

/* ── 一則新聞的完整旅程 ─────────────────────────────────────────────
   評審自己貼一則新聞，看它穿過每一層。設計要點有三：

   (1) 每一層自陳「依據哪個檔」與「用不用模型」。六層裡五層是確定性規則、零呼叫，
       只有雙軸判定那層需要模型——這個對比是 Token 紀律最有力的呈現，
       它從一句宣稱變成畫面上數得出來的東西。
   (2) 警報層與週報判定層**剔除規則不同**：警報層剔否定＋假設語氣（daily_watch），
       週報判定層只剔否定（plan_engine，已凍結）。面板如實分開顯示，不假裝一致。
   (3) 本面板等於同一份邏輯的第三份實作（Python×2 ＋ JS）。故載入時以建置時
       Python 正本算出的 62 則基準自我比對，不一致即示警——見金庫
       〈重寫的判定必須自證與正本一致〉。基準用未跳脫原文算，比對前須 deEnt()。 */
const AL=DATA.alertLayer||null;
const jnEsc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
/* 警報層的語氣剔除：否定與假設一趟做完。必須單趟——分兩次切句時，第一次 join 後
   標點已失，第二次切不出邊界，一個「若」會清空整篇（2026-08-22 實際踩過）。 */
function jnStrip(text){
  if(!AL)return {kept:text,dropped:[]};
  const re=new RegExp(AL.clause), kept=[], dropped=[];
  String(text).split(re).forEach(cl=>{
    if(!cl.trim())return;
    let probe=cl;
    AL.negOk.concat(AL.hypoOk).forEach(w=>{probe=probe.split(w).join('')});
    const n=AL.neg.find(x=>probe.indexOf(x)>=0), h=AL.hypo.find(x=>probe.indexOf(x)>=0);
    if(n)dropped.push({cl,why:`含否定詞「${n}」——說的是沒發生`});
    else if(h)dropped.push({cl,why:`含假設語氣「${h}」——說的是還沒發生`});
    else kept.push(cl);
  });
  return {kept:kept.join(' '),dropped};
}
/* 警報分級：組內 any/anyB 為 OR、組間 AND、all 須全數在場（對齊 daily_watch.classify） */
function jnClassify(text){
  if(!AL)return [];
  const t=jnStrip(text).kept, out=[];
  AL.rules.forEach(r=>{
    const m=r.match, hits={}; let ok=true;
    ['any','anyB'].forEach(g=>{
      if(!m[g])return;
      const h=m[g].filter(k=>t.indexOf(k)>=0);
      if(h.length)hits[g]=h; else ok=false;
    });
    if(ok&&m.all){
      if(m.all.every(k=>t.indexOf(k)>=0))hits.all=m.all.slice(); else ok=false;
    }
    if(ok)out.push({r,hits});
  });
  return out;
}
const jnTier=ms=>ms.some(x=>x.r.tier==='RED')?'RED':(ms.length?'YELLOW':'GREEN');
/* 自證：用同一批歷史事件重跑，與建置時的 Python 結果逐則比對 */
function jnSelfCheck(){
  if(!AL)return null;
  const exp={}; AL.selfCheck.forEach(x=>exp[x.k]=x);
  let n=0, bad=[];
  DATA.weeks.forEach(w=>(w.events||[]).forEach((e,i)=>{
    const k='W'+w.week+'-'+i, x=exp[k]; if(!x)return;
    n++;
    /* 基準以未跳脫原文計算，這裡的字串已 HTML 跳脫，必須先還原再比 */
    const ms=jnClassify(deEnt(e.title||'')+' '+deEnt(e.summary||''));
    const ids=ms.map(m=>m.r.id).sort().join(','), tier=jnTier(ms);
    if(tier!==x.tier||ids!==x.ids.join(','))
      bad.push(`${k} Python=${x.tier}/${x.ids.join(',')||'無'} JS=${tier}/${ids||'無'}`);
  }));
  return {n,bad};
}
/* 相似事件：與歷史事件比對（字元 bigram），對應 daily_watch 的 72 小時去重 */
function jnSimilar(title){
  const bg=s=>{s=String(s).replace(/\s+/g,'');const o=new Set();
    for(let i=0;i<s.length-1;i++)o.add(s.slice(i,i+2));return o};
  const A=bg(title); if(!A.size)return [];
  const out=[];
  DATA.weeks.forEach(w=>(w.events||[]).forEach(e=>{
    const B=bg(deEnt(e.title||'')); if(!B.size)return;
    let n=0; A.forEach(x=>{if(B.has(x))n++});
    const s=n/(A.size+B.size-n);
    if(s>=0.35)out.push({w:'W'+w.week,t:deEnt(e.title||''),s});
  }));
  return out.sort((a,b)=>b.s-a.s).slice(0,3);
}

function wireDaily(){
  const st=$('#dlstrip'), out=$('#dlout'); if(!st||!DL)return;
  const byd={}; DL.days.forEach(x=>byd[x.d]=x);
  const gaps=new Set(DL.gaps);
  const [a,b]=DL.span, days=[];
  /* ⚠ 全程走 UTC。`new Date('2026-08-01T00:00:00')` 以**本地時間**解析，
     再用 toISOString() 取字串會轉回 UTC——在 UTC+8 整串倒退一天，
     結果是首日被吃掉、末日畫不出來（實測 08/24 整格消失）。
     加 'Z' 解析、用 setUTCDate 遞增、toISOString 取字串，三者口徑一致才不會漂。 */
  for(let t=new Date(a+'T00:00:00Z');t<=new Date(b+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+1)){
    const s=t.toISOString().slice(0,10);
    days.push({s,x:byd[s]||null,gap:gaps.has(s)});
  }
  const cls=o=>{
    if(o.gap||!o.x)return 's-gap';
    if(o.x.red>0)return 's-hit';
    if(o.x.yellow>0)return 's-yel';
    return o.x.how==='auto'?'s-zero':'s-man';
  };
  const draw=d=>{
    $$('#dlstrip button').forEach(b=>b.classList.toggle('on',b.dataset.d===d));
    const x=byd[d];
    if(!x){out.innerHTML=`<div class="dl-day"><div class="dl-dh"><b>${d}</b>
      <span class="dl-tag s-gap">沒跑</span></div>
      <div class="dl-none">這一天沒有執行紀錄，也沒有日誌。<b>不是零警報，是沒跑。</b>
      每日巡邏於 ${DL.receiptFrom} 起才由 GitHub Actions 自動執行，先前為人工不定期巡邏。</div></div>`;return}
    const tag=x.red>0?['有 RED','s-hit']:x.yellow>0?['有 YELLOW','s-yel']
      :x.how==='auto'?['跑了，零警報','s-zero']:['人工巡邏，零警報','s-man'];
    out.innerHTML=`<div class="dl-day">
      <div class="dl-dh"><b>${d}</b><span class="dl-tag ${tag[1]}">${tag[0]}</span>
        <span class="dl-meta">${x.how==='auto'
          ? `Actions 自動執行 ${x.at}　掃描 ${x.scanned} 則　收據 status=${x.status}　mode=${x.mode}`
          : '人工巡邏（收據制上線前，無執行收據）'}</span></div>
      ${x.items.length?x.items.map(it=>`<div class="dl-i">
          <span class="dl-t t-${it.tier}">${it.tier}</span>
          <div><div class="dl-it">${it.title}</div>
            <div class="dl-is">${it.ruleId?`<span class="tag">${it.ruleId}</span>`:''}${it.source||''}${it.date?'　'+it.date:''}
              ${it.url?` · <a href="${safeUrl(it.url)}" target="_blank" rel="noopener">原文 <span class="arw">↗</span></a>`:''}
              ${it.alerted?' · <b>已寄警報信</b>':''}</div>
            ${it.summary?`<div class="dl-iy">${it.summary}</div>`:''}</div></div>`).join('')
        :`<div class="dl-none">${x.how==='auto'
            ? `掃描 ${x.scanned} 則，未達 YELLOW 以上；GREEN 不落日誌，故無日誌檔，<b>收據為證</b>。`
            : '這天巡邏後沒有落檔項目。'}</div>`}
    </div>`;
  };
  st.innerHTML=days.map(o=>`<button type="button" class="${cls(o)}" data-d="${o.s}"
    title="${o.s}${o.gap||!o.x?'　沒跑':`　${o.x.how==='auto'?'自動':'人工'}　RED ${o.x.red}／YELLOW ${o.x.yellow}`}"
    aria-label="${o.s}">${o.s.slice(8)}</button>`).join('');
  $$('#dlstrip button').forEach(b=>b.onclick=()=>draw(b.dataset.d));
  /* 預設停在最後一個有紀錄的日子——那是最新狀態 */
  draw(DL.days[DL.days.length-1].d);
}

/* ── 事前預測與否證條件 ─────────────────────────────────────────────
   憲法 LAYER 10 決策四問的第四問（「若判斷錯誤，最早可從哪個領先訊號察覺」）落地。
   只列風險不算預測；**敢寫下自己怎麼算輸才算**。

   面板的核心不是預測本身，是讓「事前」這件事可被查證：
     · 每則標明寫入日與驗證日，且驗證日一律在寫入日之後
     · 檔案進 git，commit 時間即時間戳——事後無法偽造
     · 結果只追加（outcome 事後填），claim 與 falsify 一字不改
   三種預測的知識論地位不同（外部事實／系統行為／自身判定），刻意分開標示：
   預測自己的座標帶有循環性，不可當成預測能力的證據，面板明寫這件事。 */
const PRED=DATA.predictions||null;
const PT_CLS={'外部事實':'p-ext','系統行為':'p-sys','自身判定':'p-self'};
function predHTML(S){
  if(!PRED||!(PRED.predictions||[]).length)return '';
  const ps=PRED.predictions;
  const open=ps.filter(p=>!p.outcome).length, done=ps.length-open;
  return `
  <section id="predict" data-tab="analysis">
    <div class="sh"><span class="ix">§10</span><h2>事前預測與否證條件</h2><span class="q">敢不敢先說，錯了算誰的？</span>
      <span class="sub">${S?'每則預測都先寫好「什麼情況算我錯」'
        :'憲法 LAYER 10 第四問落地 · 寫入日早於驗證日 · 結果只追加不覆寫'}</span></div>
    <div class="pd-bar">
      <span class="pd-k"><b>${ps.length}</b>則預測</span>
      <span class="pd-k"><b>${open}</b>待驗證</span>
      ${done?`<span class="pd-k"><b>${done}</b>已結果</span>`:''}
      <span class="pd-note"><code>data/predictions.json</code> 於寫入當日提交進 git，
        <b>commit 時間即時間戳</b>；結果欄只追加，預測與否證條件不改。</span>
    </div>
    ${ps.map(p=>{
      const st=p.outcome?(p.outcome.correct?['命中','o-hit']:['未命中','o-miss']):['待驗證','o-wait'];
      return `<div class="pd">
        <div class="pd-h">
          <span class="pd-id">${p.id}</span>
          <span class="pd-t ${PT_CLS[p.type]||''}">${p.type}</span>
          <span class="pd-st ${st[1]}">${st[0]}</span>
          <span class="pd-d">寫於 ${p.made}（${p.madeAtWeek}）→ 驗於 ${p.verifyOn}</span>
        </div>
        <div class="pd-claim">${p.claim}</div>
        <div class="pd-fal"><b>否證條件</b>${p.falsify}</div>
        <details class="pd-more"><summary>依據、以及萬一錯了代表什麼</summary>
          <div class="pd-sec"><b>依據</b><ul>${(p.basis||[]).map(b=>`<li>${b}</li>`).join('')}</ul></div>
          <div class="pd-sec"><b>若錯了</b>${p.ifWrong||''}</div>
          <div class="pd-sec"><b>驗證方式</b>${p.verifyBy||''}　信心 ${p.confidence||'—'}</div>
          ${p.caveat?`<div class="pd-cav">${mdb(p.caveat)}</div>`:''}
        </details>
        ${p.outcome?`<div class="pd-out"><b>事後結果（${p.outcome.on}）</b>${p.outcome.note}</div>`:''}
      </div>`}).join('')}
    <div class="pd-foot">${PRED._type_note.split('：')[0]}——
      <b>外部事實</b>對世界的預測，最可能錯也最有價值；
      <b>系統行為</b>對本系統警報層的預測，可判定但半循環；
      <b>自身判定</b>對本系統下週座標的預測，<b>座標是我方判斷，預測自己等於陳述意圖，
      不可當成預測能力的證據</b>——仍列出，是為了錯的時候強制自我檢討。</div>
  </section>`;
}

/* ── 回測時光機 ─────────────────────────────────────────────────────
   拉時間軸回到任一週，看「當時說了什麼」與「後來怎麼了」並排。
   全部是既有資料的重新呈現，不新增任何判定：
     · 當時說了什麼 → weeks.json 的 xy／scenario／firedPlaybooks／riskRadar
     · 後來怎麼了   → risk_outcomes.json 的事後結果（建置時合併）＋ 後續週次實際座標
   三個不能粉飾的地方，面板一律照實顯示：
     (1) W1／W2／W4 沒有風險雷達——W3 起才產出，歷史事實不回頭補寫。
     (2) 回測有評判截止日（risk_outcomes._judged）；晚於該日的週次標「未評判」，
         不是留白，也不假裝已經追蹤過。
     (3) 「追蹤中」占多數（19/28）。不計算「命中率」——把未結案當成失敗或成功
         都是誤導，數字要照分類原樣呈現。 */
const BT_ST={hit:['已應驗','st-hit'],resolved:['已化解','st-res'],watching:['追蹤中','st-wat']};
function backtestHTML(S){
  const ws=DATA.weeks; if(!ws||ws.length<2)return '';
  let hit=0,res=0,wat=0,un=0,none=0;
  ws.forEach(w=>{const rr=w.riskRadar||[];
    if(!rr.length){none++;return}
    rr.forEach(r=>{const s=r.status;
      if(s==='hit')hit++;else if(s==='resolved')res++;else if(s==='watching')wat++;else un++})});
  const jd=DATA.riskJudged||'';
  return `
  <section id="backtest" data-tab="analysis">
    <div class="sh"><span class="ix">§09</span><h2>回測時光機</h2><span class="q">當時說了什麼？後來怎麼了？</span>
      <span class="sub">${S?'把當週判定與事後結果並排'
        :'逐週對照 · 當週判定 vs 事後結果 · 既有資料重新呈現'}</span></div>
    <div class="bt-sum">
      <span class="bt-k"><b>${hit}</b>已應驗</span>
      <span class="bt-k"><b>${res}</b>已化解</span>
      <span class="bt-k"><b>${wat}</b>追蹤中</span>
      ${un?`<span class="bt-k mut"><b>${un}</b>未評判</span>`:''}
      <span class="bt-note">${jd?`評判截止 ${jd}，晚於此日產出者標「未評判」。`:''}
        ${none?`另 ${none} 週無風險雷達（W3 起才產出）。`:''}
        <b>不計算命中率</b>。</span>
    </div>
    <div class="bt-tl" id="bttl" role="tablist" aria-label="選擇週次"></div>
    <div id="btout"></div>
  </section>`;
}
function wireBacktest(){
  const tl=$('#bttl'), out=$('#btout'); if(!tl||!out)return;
  const ws=DATA.weeks;
  const draw=n=>{
    $$('#bttl button').forEach(b=>{const on=+b.dataset.n===n;
      b.classList.toggle('on',on); b.setAttribute('aria-selected',on)});
    const w=ws[n], p=n>0?ws[n-1]:null;
    const dx=p?w.xy.x-p.xy.x:0, dy=p?w.xy.y-p.xy.y:0;
    const fired=((w.companyPlan||{}).firedPlaybooks||[]).map(f=>f.id);
    const rr=w.riskRadar||[];
    /* 後續實際走向：不是預測評分，是把後面幾週的實際座標攤出來讓人自己看 */
    const after=ws.slice(n+1,n+5).map(x=>`<span class="bt-af"><b>W${x.week}</b>
      X ${fmt(x.xy.x)} <i>${x.xy.x<w.xy.x?'更碎裂':x.xy.x>w.xy.x?'回緩':'持平'}</i>
      Y ${fmt(x.xy.y)} <i>${x.xy.y>w.xy.y?'更充沛':x.xy.y<w.xy.y?'轉弱':'持平'}</i></span>`).join('');
    out.innerHTML=`
      <div class="bt-two">
        <div class="card">
          <div class="ch"><b>W${w.week} 當時說了什麼</b><span>${w.range}</span></div>
          <div class="bt-xy">${w.scenarioEn}　X ${fmt(w.xy.x)}${p?` <i>(${fmt(dx)})</i>`:''}
            Y ${fmt(w.xy.y)}${p?` <i>(${fmt(dy)})</i>`:''}</div>
          <div class="bt-pb">觸發劇本：${fired.length?fired.map(f=>`<span class="tag">${f}</span>`).join(''):'<i>無</i>'}</div>
          <div class="bt-ev">當週事件 ${(w.events||[]).length} 則</div>
        </div>
        <div class="card">
          <div class="ch"><b>後來怎麼了</b><span>${n===ws.length-1?'本週為最新，尚無後續':'其後實際座標'}</span></div>
          ${after||'<div class="bt-ev"><i>沒有後續週次可比對。</i></div>'}
        </div>
      </div>
      <div class="bt-rr">
        <div class="ch"><b>當週風險雷達</b><span>${rr.length?`${rr.length} 條，逐條附事後結果`:'本週無風險雷達'}</span></div>
        ${rr.length?rr.map(r=>{
          const st=BT_ST[r.status]||['未評判','st-un'];
          return `<div class="bt-r">
            <span class="bt-st ${st[1]}">${st[0]}</span>
            <div><div class="bt-rt">${r.risk}</div>
              <div class="bt-rs">領先訊號：${r.signal}　<span class="tag">KDF#${r.kdf}</span></div>
              ${r.followUp?`<div class="bt-fu">後續：${r.followUp}</div>`
                :`<div class="bt-fu mut">尚無事後結果紀錄${DATA.riskJudged&&w.gen>DATA.riskJudged?`——本週產出於 ${w.gen}，晚於評判截止日 ${DATA.riskJudged}`:''}。</div>`}
            </div></div>`}).join('')
          :`<div class="bt-ev"><i>W${w.week} 沒有風險雷達——H+6 風險雷達自 W3 起才納入憲法 LAYER 10，
             先前週次不回頭補寫。這是歷史事實，不是資料遺失。</i></div>`}
      </div>`;
  };
  tl.innerHTML=ws.map((w,i)=>`<button type="button" role="tab" data-n="${i}"
    aria-selected="false">W${w.week}</button>`).join('');
  $$('#bttl button').forEach(b=>b.onclick=()=>draw(+b.dataset.n));
  tl.onkeydown=e=>{
    if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;
    const bs=$$('#bttl button'), i=bs.indexOf(document.activeElement); if(i<0)return;
    e.preventDefault();
    const j=e.key==='Home'?0:e.key==='End'?bs.length-1
      :e.key==='ArrowRight'?Math.min(bs.length-1,i+1):Math.max(0,i-1);
    bs[j].focus(); bs[j].click();
  };
  /* 預設停在最早有風險雷達且已評判的一週——那是回測最有東西可看的地方 */
  const first=ws.findIndex(w=>(w.riskRadar||[]).some(r=>r.status));
  draw(first>=0?first:0);
}

function journeyHTML(S){
  if(!AL)return '';
  return `

    <div class="sh"><span class="ix">§06</span><h2>試一則新聞</h2><span class="q">情報進來之後，實際發生什麼事？</span>

}
const JN_SAMPLES={
  jneg1:'中國延遲並限制鍺、石英與永磁對台灣出口，衝擊半導體與光學供應鏈。石英製品為測試廠基礎耗材。',
  jneg2:'本週台灣新竹、龍潭、桃園園區無天災、停電或缺水通報，產線運作正常。',
  jneg3:'外資報告：若新竹缺水或桃園停電，測試產能將受衝擊，建議留意後續。'
};
function wireJourney(i){
  const out=$('#jnout'), ta=$('#jntext'), go=$('#jngo');
  if(!out||!ta||!go||!AL)return;
  const sc=$('#jnsc'), r=jnSelfCheck();
  if(sc&&r){
    const ok=r.bad.length===0;
    sc.textContent=view==='simple'
      ? (ok?`自己驗過 ${r.n}/${r.n}，和原程式一致`:`自己驗出 ${r.bad.length}/${r.n} 不一致`)
      : (ok?`自證 ${r.n}/${r.n} 與正本一致`:`自證不一致 ${r.bad.length}/${r.n}`);
    sc.className='chip'+(ok?'':' lo');
    sc.title=ok?`以建置時 Python 正本對 ${r.n} 則歷史事件的分級結果比對，逐則相同`
      :'JS 鏡像與 Python 正本分岔：\n'+r.bad.slice(0,5).join('\n');
  }
  const L=(n,name,src,tok,body)=>`<div class="jn-l">
    <div class="jn-h"><span class="jn-n">${n}</span><b>${name}</b>
      <span class="jn-src">依據 ${src}</span>
      <span class="jn-tok${tok?' model':''}">${tok?'呼叫模型':'0 tokens'}</span></div>
    <div class="jn-b">${body}</div></div>`;
  const run=()=>{
    const text=(ta.value||'').trim();
    if(!text){out.innerHTML='<div class="jn-empty">先貼一段文字，或按上面三個範例其中一個。</div>';return}
    const w=DATA.weeks[i];
    /* ① 語氣剔除（警報層口徑：否定＋假設） */
    const st=jnStrip(text);
    const l1=st.dropped.length
      ? st.dropped.map(d=>`<div class="jn-drop"><s>${jnEsc(d.cl)}</s><span>${d.why}</span></div>`).join('')
        +`<div class="jn-keep"><b>送進比對的文字：</b>${jnEsc(st.kept)||'<i>（整段都被剔除）</i>'}</div>`
      : '<div class="jn-keep">全段保留——沒有否定或假設語氣的子句。</div>';
    /* ② 警報分級 */
    const ms=jnClassify(text), tier=jnTier(ms);
    const tierName={RED:'關鍵',YELLOW:'主要',GREEN:'次要'}[tier];
    const l2=`<div class="jn-tier t-${tier}"><b>${tier}</b>${tierName}　${AL.tiers[tier]}</div>`
      +(ms.length?ms.map(m=>`<div class="jn-rule"><span class="tag">${m.r.id}</span>
        ${Object.keys(m.hits).map(g=>`<em>${g==='all'?'必要條件':'關鍵字'}</em>${m.hits[g].join('、')}`).join('　')}
        <div class="jn-why">${m.r.why}${m.r.playbook&&m.r.playbook!=='—'?`　→ 對應劇本 ${m.r.playbook}`:''}</div></div>`).join('')
        :'<div class="jn-why">未命中任何規則，屬一般產業動態；每日監測不落檔，由週報搜尋涵蓋。</div>');
    /* ③ 相似事件（去重） */
    const sim=jnSimilar(text.split(/[。\n]/)[0]);
    const l3=sim.length
      ? sim.map(s=>`<div class="jn-sim"><b>${(s.s*100).toFixed(0)}%</b> ${s.w}　${jnEsc(s.t)}</div>`).join('')
        +`<div class="jn-why">相似度 ≥50% 且在 72 小時內者視為同源續報，不重複發警報——只記日誌保留時間線。</div>`
      : '<div class="jn-why">與過去十一週的事件皆不相似，屬新事件。</div>';
    /* ④ 劇本觸發（週報判定層口徑：只剔否定，plan_engine 已凍結） */
    const pText=simStripNeg(text);
    const ev=simEval({x:w.xy.x,y:w.xy.y},w,pText).filter(p=>p.ok);
    const l4=(ev.length?ev.map(p=>`<div class="jn-rule"><span class="tag">${p.id}</span>${p.title}
        <div class="jn-why">${p.conds.map(c=>(c[0]?'✓ ':'✗ ')+c[1]).join('　')}</div></div>`).join('')
      :'<div class="jn-why">以本週座標與權重計算，這則不足以點燃任何劇本。</div>')
      +`<div class="jn-note">此層沿用週報判定的口徑：<b>只剔除否定、不剔假設語氣</b>——
        <code>plan_engine.py</code> 已隨十一週紀錄凍結，修改它會改動已發佈的判定。
        警報層（第②層）較嚴，兩層本來就不同，這裡如實分開。</div>`
      /* 兩層結論不一致時主動說破——評審一定看得出來，與其被問不如自己講 */
      +((tier==='GREEN'&&ev.length)?`<div class="jn-note" style="border-color:rgba(176,16,106,.3);background:rgba(176,16,106,.05)">
        <b>兩層結論不同，這是預期的。</b>第②層判 GREEN（不發警報），第④層卻點燃了

        劇本層沒有。<b>警報問的是「要不要現在叫醒人」，劇本問的是「這週規畫要不要納入這個面向」</b>

    const l5=`<div class="jn-why">前四層全部是確定性規則，同樣的輸入永遠得到同樣的輸出，
        各位可以自己重算。<b>只有雙軸位移需要語意理解</b>，那是唯一呼叫模型的地方。</div>
      <button type="button" class="jn-go sm" id="jnai">把這段交給 AI 判定 X／Y →</button>`;
    out.innerHTML=L(1,'語氣剔除','daily_watch.strip_untriggerable',0,l1)
      +L(2,'警報分級','data/alert_rules.json',0,l2)
      +L(3,'同源去重','logs/alerts_log.csv 之 72 小時規則',0,l3)
      +L(4,'劇本觸發','data/playbook.json ＋ plan_engine',0,l4)
      +L(5,'雙軸位移判定','Cloudflare Worker',1,l5);
    const ai=$('#jnai');
    if(ai)ai.onclick=()=>{
      const t=$('#jdtext'); if(!t){alert('AI 判定面板未載入');return}
      t.value=text;
      const sec=t.closest('section');
      if(sec&&sec.dataset.tab&&sec.dataset.tab!==curTab)setTab(sec.dataset.tab);
      t.scrollIntoView({behavior:'smooth',block:'center'});
      const g=$('#jdgo'); if(g)setTimeout(()=>g.click(),400);
    };
  };
  go.onclick=run;
  Object.keys(JN_SAMPLES).forEach(k=>{const b=$('#'+k);
    if(b)b.onclick=()=>{ta.value=JN_SAMPLES[k];run()}});
}

/* ── 資料匯出（CSV）──
   2026-08-24 依指導教授意見新增：情報要能「丟進他們自己的內部策略分析」，
   看得到不等於用得到。刻意用 CSV 而非 .xlsx——站上不引入任何函式庫或打包工具，
   CSV 由瀏覽器原生 Blob 產生，Excel 雙擊即開、Google 試算表可直接匯入。
   兩個必踩的坑：
   (1) 開頭必須加 UTF-8 BOM，否則 Excel 以系統編碼開啟，繁中全部亂碼。
   (2) DATA.weeks 的字串在建置時已 HTML 跳脫，須以 deEnt() 還原，否則匯出檔會
       出現 &amp;、&lt;——與 canvas 用 fillText 前要 deEnt 是同一個原因。 */
const csvCell=v=>{const s=deEnt(v==null?'':String(v));
  return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const csvOf=rows=>'﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
function dlFile(name,text){
  const b=new Blob([text],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
}
const EXPORTS={
  trend:{label:'趨勢總表',hint:'全週次 × 雙軸座標 × 25 項 KDF 權重',rows:()=>{
    const r=[['週次','區間','產生日','情境','情境(EN)','X 地緣聚合','Y 資源充沛',
      '觸發劇本','事件數',...DATA.kdf.map(k=>`#${k.id} ${k.name}`)]];
    DATA.weeks.forEach(w=>r.push(['W'+w.week,w.range,w.gen,w.scenario,w.scenarioEn,
      w.xy.x,w.xy.y,(((w.companyPlan||{}).firedPlaybooks)||[]).map(f=>f.id).join('｜'),
      (w.events||[]).length,...w.w]));
    return r}},
  events:{label:'事件總表',hint:'全週次事件、影響方向與可查證連結',rows:()=>{
    const r=[['週次','日期','標題','來源','X 影響','Y 影響','摘要','連結']];
    DATA.weeks.forEach(w=>(w.events||[]).forEach(e=>r.push(['W'+w.week,e.date,e.title,
      e.source,e.xImpact||'→',e.yImpact||'→',e.summary,e.url])));
    return r}},
  risk:{label:'風險雷達',hint:'全週次風險、規避動作與事後結果回測',rows:()=>{
    const r=[['週次','風險','領先訊號','KDF','規避動作','事後結果','後續']];
    DATA.weeks.forEach(w=>(w.riskRadar||[]).forEach(x=>r.push(['W'+w.week,x.risk,x.signal,
      'KDF#'+x.kdf,x.mitigation,x.status||'追蹤中',x.followUp||''])));
    return r}},
  trace:{label:'決策軌跡',hint:'每筆事件的軸位移與 KDF 調整依據',rows:()=>{
    const r=[['週次','事件','關鍵字','ΔX','ΔY','KDF 編號','項目','調整前','調整後','理由']];
    DATA.weeks.forEach(w=>(w.decisionTrace||[]).forEach(t=>{
      const kc=t.kdfChanges||[];
      if(!kc.length){r.push(['W'+w.week,t.event,(t.keywords||[]).join('｜'),
        t.xDelta,t.yDelta,'','','','','']);return}
      kc.forEach((k,i)=>r.push(['W'+w.week,i?'':t.event,i?'':(t.keywords||[]).join('｜'),
        i?'':t.xDelta,i?'':t.yDelta,'#'+k.id,k.name,k.from,k.to,k.reason]));
    }));
    return r}}
};

   靜態內容不必等圖表庫，離線版與列印皆可用。 */
/* 四級來源標記。「年報」為法定公開揭露之原始數字，可信度最高，給實心底以資區別 */
const SRCCLS={'年報':'rep','查證':'ok','推斷':'inf','待公司確認':'wait','第三方':'wait'};
/* 來源標記。帶 url 時渲染成可點連結——「查證」這種徽章若點不下去，等於只是宣稱。
   url 由 industry_position.json 提供，指向官網對應單元（查證之處，非逐項深連結；
   官網為 JS 動態站、公開資訊觀測站無穩定深連結，故不宣稱能定位到那一行）。 */
const srcTag=(s,u)=>{if(!s)return'';const c=SRCCLS[s]||'inf';
  return u?`<a class="src ${c} lk" href="${safeUrl(u)}" target="_blank" rel="noopener" title="開啟來源頁">${s} ↗</a>`
          :`<span class="src ${c}">${s}</span>`;};
function posMap(P){
  const A=P.axes,PL=P.players;
  const X=v=>90+v/100*860, Y=v=>520-v/100*480;
  const grid=[25,50,75].map(g=>
    `<line x1="${X(g)}" y1="40" x2="${X(g)}" y2="520" stroke="var(--line)" stroke-width="1"/>
     <line x1="90" y1="${Y(g)}" x2="950" y2="${Y(g)}" stroke="var(--line)" stroke-width="1"/>`).join('');
  const dots=PL.map(p=>{
    /* 標籤讓開圓點：欣銓另有 r=21 的高亮外環，用一般的 18 位移會壓在環線上 */
    const cx=X(p.x),cy=Y(p.y),end=p.x>55,off=p.self?30:18;
    return `<g>
      <circle cx="${cx}" cy="${cy}" r="${p.self?13:8}"
        fill="${p.self?'var(--accent)':'var(--muted)'}" ${p.self?'':'fill-opacity=".62"'}/>
      ${p.self?`<circle cx="${cx}" cy="${cy}" r="21" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-opacity=".45"/>`:''}
      <text x="${end?cx-off:cx+off}" y="${cy+6}" text-anchor="${end?'end':'start'}"
        font-size="19" font-weight="${p.self?'700':'500'}"
        fill="${p.self?'var(--accent)':'var(--ink2)'}">${p.n}</text></g>`;
  }).join('');
  return `<svg viewBox="0 0 1000 620" role="img"
      aria-label="競爭定位圖：橫軸${A.x.name}（左${A.x.lo}、右${A.x.hi}），縱軸${A.y.name}（下${A.y.lo}、上${A.y.hi}）。${PL.map(p=>p.n+'位於'+p.x+'／'+p.y).join('；')}。座標為推斷值。">
    ${grid}
    <line x1="90" y1="520" x2="950" y2="520" stroke="var(--ink2)" stroke-width="2"/>
    <line x1="90" y1="40" x2="90" y2="520" stroke="var(--ink2)" stroke-width="2"/>
    ${dots}
    <text x="90" y="556" font-size="17" fill="var(--muted)">← ${A.x.lo}</text>
    <text x="950" y="556" font-size="17" fill="var(--muted)" text-anchor="end">${A.x.hi} →</text>
    <text x="520" y="590" font-size="18" font-weight="600" fill="var(--ink2)" text-anchor="middle">${A.x.name}</text>
    <!-- Y 軸端點標籤放在軸線**內側**並靠左對齊：原本用 text-anchor="end" 貼在 x=72
         往左延伸，長字串（AI ASIC・SLT・矽光子）會伸出 viewBox 左緣 118 單位被切掉。
         SVG 沒有溢出捲軸也不報錯，只是安靜地少一截字。 -->
    <text x="100" y="64" font-size="17" fill="var(--muted)">↑ ${A.y.hi}</text>
    <text x="100" y="506" font-size="17" fill="var(--muted)">↓ ${A.y.lo}</text>
    <text x="30" y="280" font-size="18" font-weight="600" fill="var(--ink2)" text-anchor="middle"
      transform="rotate(-90 30 280)">${A.y.name}</text>
  </svg>`;
}

/* 圖表資料點講解的鍵盤路徑。原本 showWeekPop() 只能經 Chart.js 的 onClick 進入，
   canvas 無 tabindex 也無鍵盤處理，圖說卻寫著「點資料點可看該週講解」——鍵盤
   使用者做不到該動作。以左右鍵在已繪出的週次間移動、Enter／空白鍵開啟講解，
   並以視覺隱藏的 aria-live 區播報目前落點（canvas 內容本身無法被輔助科技讀取）。 */
const chartKbIdx={};
function bindChartKeys(id,liveId){
  const cv=$('#'+id),live=$('#'+liveId);
  if(!cv)return;
  chartKbIdx[id]=cur;                       /* 每次重繪都回到本週，行為可預期 */
  /* 明眼鍵盤使用者也要看得到目前落點：以 Chart.js 的 active elements 亮起
     該週資料點並帶出 tooltip，與滑鼠 hover 同一套視覺；失焦即清除。 */
  const mark=on=>{try{const ch=Chart.getChart(cv);if(!ch)return;
    const k=chartKbIdx[id];
    const els=on?ch.data.datasets.map((d,di)=>({datasetIndex:di,index:k}))
      .filter(x=>(ch.data.datasets[x.datasetIndex].data||[]).length>k):[];
    ch.setActiveElements(els);
    if(ch.tooltip)ch.tooltip.setActiveElements(els,{x:0,y:0});
    ch.update('none');
  }catch(e){}};
  const say=()=>{const w=DATA.weeks[chartKbIdx[id]];
    if(live&&w)live.textContent=`W${w.week}　${w.range}　按 Enter 開啟該週講解`;
    mark(true)};
  cv.onfocus=say;
  cv.onblur=()=>mark(false);
  cv.onkeydown=e=>{
    const max=cur;let k=chartKbIdx[id];
    if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){e.preventDefault();showWeekPop(k);return}
    if(e.key==='ArrowRight'||e.key==='ArrowDown')k=Math.min(max,k+1);
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp')k=Math.max(0,k-1);
    else if(e.key==='Home')k=0;
    else if(e.key==='End')k=max;
    else return;
    e.preventDefault();chartKbIdx[id]=k;say();
  };
}

/* ── hero 指標聚光：CSS 變數驅動的極淡網格／底紋位移（無光球、無殘影） ── */
function heroFx(){
  const el=$('.brief');if(!el)return;
  if(!matchMedia('(pointer:fine)').matches)return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const main=el.querySelector('.brief-main');if(!main)return;
  let tick=false;
  main.addEventListener('pointermove',e=>{
    el.classList.add('fx');
    if(tick)return;tick=true;
    requestAnimationFrame(()=>{tick=false;
      const r=main.getBoundingClientRect();
      const x=e.clientX-r.left,y=e.clientY-r.top;
      el.style.setProperty('--mx',x.toFixed(1)+'px');
      el.style.setProperty('--my',y.toFixed(1)+'px');
      el.style.setProperty('--px',(((x/r.width)-.5)*-12).toFixed(1)+'px');
      el.style.setProperty('--py',(((y/r.height)-.5)*-8).toFixed(1)+'px');});
  },{passive:true});
  main.addEventListener('pointerleave',()=>{el.classList.remove('fx');
    el.style.setProperty('--px','0px');el.style.setProperty('--py','0px')});
}

function aiAnswer(q){
  const w=DATA.weeks[cur],n=w.week,CO=DATA.companies||[];
  const coPlanOf=c=>c?(c.real?(w.companyPlan||null):((c.plans||{})[String(n)]||null)):(w.companyPlan||null);
  const SRC=`<div class="ai-src">來源：本站 W${n}（${w.range}）資料｜規則式回答，零 token</div>`;
  const t=q.toLowerCase();
  const idm=q.match(/(PB|DA|DB)[-‐]?(\d{2})/i);
  if(idm){
    const id=(idm[1]+'-'+idm[2]).toUpperCase();
    for(const c of (CO.length?CO:[null])){
      const p=coPlanOf(c);if(!p)continue;
      const f=(p.firedPlaybooks||[]).find(x=>x.id===id);
      if(f)return `<b>${id}｜${f.title}</b>（${c?c.short:'欣銓'}，本週<b>已觸發</b>）<br>建議行動：${f.action}<br>觸發依據：${f.evidence}${SRC}`;
      const d0=(p.dormantPlaybooks||[]).find(x=>x.id===id);
      if(d0)return `<b>${id}｜${d0.title}</b>（${c?c.short:'欣銓'}，本週<b>未觸發</b>）<br>判定依據：${d0.evidence}${SRC}`;
    }
    return `找不到劇本 ${id}。欣銓為 PB-01～08；示範企業為 DA-01～05／DB-01～05。${SRC}`;
  }
  if(/(差|比較|三家|哪家|弘遠|凌樞)/.test(q)&&CO.length>1){
    const rows=CO.map(c=>{const p=coPlanOf(c);const ids=((p&&p.firedPlaybooks)||[]).map(f=>f.id).join('、')||'無';
      return `・<b>${c.short}</b>${c.real?'':'（虛構示範）'}：${ids}`}).join('<br>');
    return `W${n} 三家企業的觸發劇本：<br>${rows}<br>同一週情境資料、不同企業畫像與劇本組，結果隨之不同——這就是引擎的可移植性。完整內容見「公司」分頁。${SRC}`;
  }
  if(/(本週|判定|情境|結論|現在怎)/.test(q)){
    const f=((w.companyPlan||{}).firedPlaybooks)||[];
    const top=DATA.kdf.map((k,j)=>({id:k.id,name:k.name,v:w.w[j]})).sort((a,b)=>b.v-a.v).slice(0,3);
    return `W${n}（${w.range}）判定：<b>${w.scenario}</b>（${w.scenarioEn}），X ${fmt(w.xy.x)}、Y ${fmt(w.xy.y)}。<br>前三大 KDF：${top.map(k=>`#${k.id} ${k.name.replace(/（.*/,'')}（${k.v}）`).join('、')}。<br>欣銓觸發 ${f.length} 條劇本：${f.map(x=>x.id).join('、')||'無'}。詳見「總覽」與「公司」分頁。${SRC}`;
  }
  if(/(風險|雷達|提防|注意)/.test(q)){
    const rs=w.riskRadar||[];
    if(!rs.length)return `W${n} 無風險雷達紀錄（H+6 風險雷達為 2026-07-10 導入之機制，部分早期週次未回填——此為歷史事實，不回頭補寫）。${SRC}`;
    return `W${n} 風險雷達（前 ${Math.min(3,rs.length)} 項）：<br>${rs.slice(0,3).map(r=>`・${r.risk}<br>　領先訊號：${r.signal}`).join('<br>')}${SRC}`;
  }
  /* 用詞邊界比對：原本的 /(x|y|…)/ 會把英文 why 裡的 y 當成軸向查詢 */
  if(/(\bx\s*軸|\by\s*軸|\bx\b|\by\b|軸|座標|象限|方法論|kdf)/i.test(t)){
    return `方法論：<b>X 軸＝地緣與供應鏈聚合</b>（−1 碎裂 ↔ +1 聚合）、<b>Y 軸＝資源與政策充沛</b>（−1 匱乏 ↔ +1 充沛），定位四情境後校準 25 項 KDF 權重（中性 50），每次調整附 Decision Trace。詳見「治理」分頁 §17。${SRC}`;
  }
  if(/(治理|token|護欄|控管|harness)/i.test(t)){
    return `治理六面向見「治理」分頁 §16：任務分派（四層單向管線）、記憶（append-only）、工具（時間窗檢索）、護欄（缺漏防呆＋四道匯入門檻）、可觀測（Decision Trace＋自我稽核）、評估（確定性重算＋外部對抗審查）。Token 用量分兩段講：開發階段有三個工具的本機實測數字（見 §16）；運作階段為 0——本專案自始至終未取得 API 預算，雲端週報管線從未執行，十一週全部由人工分析產出並通過四道門檻。這不是待補的欄位，是本專案的實際條件。${SRC}`;
  }
  if(/(可信|來源|真的|查證|假的)/.test(q)){
    return `本站每則事件附可查證來源連結；每次權重調整附 Decision Trace；§12 自我稽核公開「判斷錯了會怎樣」；§17 揭露期間重疊與缺口等不利事實。X／Y 與建議屬分析判斷【推斷】，非官方數據、非投資建議。${SRC}`;
  }
  return `展示模式能回答：<br>・「本週判定是什麼」<br>・任一劇本編號（如「為什麼觸發 PB-07」）<br>・「三家企業差在哪」<br>・「風險雷達」「方法論」「治理」「資料可信嗎」<br>其餘問題待後端連接真 AI 後支援。${SRC}`;
}

async function aiAsk(){
  const q=aiQ.value.trim();if(!q)return;
  aiMsg('u',q,true);aiQ.value='';
  const ep=aiEP();
  if(ep){
    const seq=++aiSeq;                       /* 併發時只認最後一題，避免答案錯位 */
    const hold=aiMsg('a','思考中…');
    let tm=null;
    try{
      const ctl=new AbortController();
      tm=setTimeout(()=>ctl.abort(),15000);
      const w=DATA.weeks[cur];const co=(DATA.companies||[]).find(c=>c.id===curCompany);
      const fired=(co&&!co.real?(((co.plans||{})[String(w.week)]||{}).firedPlaybooks):((w.companyPlan||{}).firedPlaybooks))||[];
      const r=await fetch(ep,{method:'POST',headers:{'content-type':'application/json'},signal:ctl.signal,
        body:JSON.stringify({question:q,week:w.week,range:w.range,
          scenario:w.scenarioEn||w.scenario,x:w.xy.x,y:w.xy.y,
          company:co?co.short:'欣銓',
          /* 帶上觸發依據：只給 id 與標題的話，模型答不出「為什麼觸發」——
             而面板的建議問題正是「為什麼觸發 PB-07」。deEnt 還原成模型看得懂的原字。 */
          fired:fired.slice(0,12).map(f=>`${f.id} ${deEnt(f.title)}（依據：${deEnt(f.evidence||'').slice(0,90)}）`)})});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json();
      if(seq!==aiSeq){hold.remove();return}    /* 已有更新的提問，丟棄這則舊回覆 */
      hold.remove();
      const u=j.usage||{};
      const iN=Number(u.input_tokens),oN=Number(u.output_tokens);
      if(Number.isFinite(iN))aiTok.i+=iN;
      if(Number.isFinite(oN))aiTok.o+=oN;
      aiTok.n++;
      /* KV 是最終一致的，重新抓會讀到舊值；直接就地加上本次用量，畫面立刻反映。
         下次重新載入時會被 Worker 的權威值覆蓋。 */
      if(aiUse){aiUse.in=(aiUse.in||0)+(Number.isFinite(iN)?iN:0);
                aiUse.out=(aiUse.out||0)+(Number.isFinite(oN)?oN:0);
                aiUse.n=(aiUse.n||0)+1;aiUsePaint()}
      const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      aiMsg('a',`${esc(j.answer).replace(/\n/g,'<br>')}<div class="ai-src">模型：${esc(j.model||'AI')}｜本次 in ${Number.isFinite(iN)?iN:'—'}／out ${Number.isFinite(oN)?oN:'—'} tokens｜本階段累計 ${aiTok.i}／${aiTok.o}（${aiTok.n} 次）</div>`);
      aiSetMode('live');
      return;
    }catch(err){
      hold.remove();
      if(seq!==aiSeq)return;
      aiSetMode('ready');                      /* 失敗後標示回到「待命」，不可續掛「AI 連線」 */
      aiMsg('a',`<b>後端無回應</b>（${String(err&&err.message||err).slice(0,40)}），改用展示模式回答：`);
    }finally{
      if(tm)clearTimeout(tm);                  /* 逾時器一律回收，含 fetch 立即拒絕的路徑 */
    }
  }
  aiMsg('a',aiAnswer(q));
}

<script>
/* 滑鼠泡泡特效設定（2026-08-08 人類核定）
   muted：取本站現行 token #55628a（海香菇改版後值；交付文件的 #8b867d 為更早的舊值）
   trailInterval：22 → 27.5ms，軌跡生成頻率降為原本的 80%
   zIndex：2147483000 → 90，位於內容與 header(50) 之上、放大檢視(100) 與週次彈窗(110) 之下，
           避免泡泡飄在燈箱上方穿幫 */
window.SCAI_POINTER_FX_CONFIG={
  accent:'#4453d6',
  ink:'#3e4a6b',
  muted:'#55628a',
  line:'#c0c6ea',
  trailInterval:27.5,
  maxParticles:96,
  respectReducedMotion:true,
  zIndex:90
};

<script>
/*
 * SCAI-Agent Pointer Bubble FX
 * 企業級 AI 分析介面：圓點分裂泡泡 + 決策脈衝
 * 無外部依賴，可直接內嵌於 src/site_template.html。
 */
(function () {
  'use strict';

  if (window.__SCAIPointerFXLoaded) return;
  window.__SCAIPointerFXLoaded = true;

  const defaults = {
    accent: '#4453d6',
    ink: '#3e4a6b',
    muted: '#55628a',
    line: '#c0c6ea',
    trailInterval: 22,
    maxParticles: 96,
    respectReducedMotion: true,
    zIndex: 2147483000
  };
  const cfg = Object.assign({}, defaults, window.SCAI_POINTER_FX_CONFIG || {});
  const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  const fineQuery = window.matchMedia('(pointer: fine)');
  const disabled = () => cfg.respectReducedMotion && reduceQuery.matches;

  let canvas;
  let ctx;
  let dpr = 1;
  let width = 0;
  let height = 0;
  let frame = 0;
  let running = false;
  let lastTime = performance.now();
  let lastTrailAt = 0;
  let lastX = -999;
  let lastY = -999;
  const particles = [];
  const pulses = [];
  const pending = [];

  function hexToRgb(hex) {
    const value = String(hex).replace('#', '').trim();
    const full = value.length === 3
      ? value.split('').map((x) => x + x).join('')
      : value.padEnd(6, '0').slice(0, 6);
    return {
      r: parseInt(full.slice(0, 2), 16),
      g: parseInt(full.slice(2, 4), 16),
      b: parseInt(full.slice(4, 6), 16)
    };
  }

  const rgb = {
    accent: hexToRgb(cfg.accent),
    ink: hexToRgb(cfg.ink),
    muted: hexToRgb(cfg.muted),
    line: hexToRgb(cfg.line)
  };

  function rgba(color, alpha) {
    return `rgba(${color.r},${color.g},${color.b},${Math.max(0, alpha)})`;
  }

  function resize() {
    if (!canvas) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
  }

  function createLayer() {
    canvas = document.createElement('canvas');
    canvas.id = 'scai-pointer-fx';
    canvas.setAttribute('aria-hidden', 'true');
    Object.assign(canvas.style, {
      position: 'fixed',
      inset: '0',
      width: '100vw',
      height: '100vh',
      pointerEvents: 'none',
      zIndex: String(cfg.zIndex),
      background: 'transparent',
      contain: 'strict'
    });
    document.body.appendChild(canvas);
    ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
    resize();
  }

  function ensureFrame() {
    if (running || disabled()) return;
    running = true;
    lastTime = performance.now();
    frame = requestAnimationFrame(draw);
  }

  function addParticle(particle) {
    particles.push(particle);
    if (particles.length > cfg.maxParticles) {
      particles.splice(0, particles.length - cfg.maxParticles);
    }
  }

  function spawnTrail(x, y, dx, dy, now) {
    const speed = Math.hypot(dx, dy);
    if (speed < 1.5) return;
    const nx = dx / speed;
    const ny = dy / speed;
    const side = Math.random() > 0.5 ? 1 : -1;
    addParticle({
      x: x - nx * 5 - ny * side * 2,
      y: y - ny * 5 + nx * side * 2,
      vx: -nx * (0.018 + Math.random() * 0.022) - ny * side * 0.006,
      vy: -ny * (0.018 + Math.random() * 0.022) + nx * side * 0.006,
      born: now,
      life: 760 + Math.random() * 260,
      size: 3.1 + Math.random() * 1.8,
      color: Math.random() < 0.7 ? rgb.accent : rgb.muted,
      alpha: 0.72,
      kind: 'seed',
      split: false
    });
  }

  function isActionTarget(target) {
    if (!(target instanceof Element)) return false;
    return Boolean(target.closest(
      'a,button,select,summary,[role="button"],.fchip,.zoombtn,.wbtn,.vtoggle,canvas'
    ));
  }

  function spawnPulse(x, y, strong = true) {
    if (disabled()) return;
    const now = performance.now();
    pulses.push({
      x,
      y,
      born: now,
      life: strong ? 650 : 520,
      strong
    });

    const count = strong ? 18 : 11;
    for (let index = 0; index < count; index += 1) {
      const angle = (Math.PI * 2 * index / count) + (Math.random() - 0.5) * 0.22;
      const velocity = (strong ? 0.075 : 0.05) + Math.random() * 0.07;
      const colorRoll = Math.random();
      addParticle({
        x,
        y,
        vx: Math.cos(angle) * velocity,
        vy: Math.sin(angle) * velocity,
        born: now,
        life: 620 + Math.random() * 340,
        size: 2.2 + Math.random() * 2.4,
        color: colorRoll < 0.55 ? rgb.accent : colorRoll < 0.82 ? rgb.ink : rgb.line,
        alpha: strong ? 0.82 : 0.56,
        kind: index % 3 === 0 ? 'bubble' : 'dot'
      });
    }
    ensureFrame();
  }

  function onPointerMove(event) {
    if (disabled() || !fineQuery.matches || event.pointerType === 'touch') return;
    const now = performance.now();
    const dx = event.clientX - lastX;
    const dy = event.clientY - lastY;
    const moved = Math.hypot(dx, dy);
    if (now - lastTrailAt >= cfg.trailInterval && moved >= 3) {
      spawnTrail(event.clientX, event.clientY, dx, dy, now);
      lastTrailAt = now;
      ensureFrame();
    }
    lastX = event.clientX;
    lastY = event.clientY;
  }

  function onPointerDown(event) {
    if (event.button !== undefined && event.button !== 0) return;
    spawnPulse(event.clientX, event.clientY, isActionTarget(event.target));
  }

  function drawParticle(particle, now, dt) {
    const age = now - particle.born;
    const progress = age / particle.life;
    if (progress >= 1) return false;

    particle.x += particle.vx * dt;
    particle.y += particle.vy * dt;
    particle.vx *= 0.986;
    particle.vy *= 0.986;

    const fade = Math.pow(1 - progress, 1.35);

    if (particle.kind === 'seed') {
      if (!particle.split && progress > 0.26) {
        particle.split = true;
        const childCount = 2 + (Math.random() > 0.55 ? 1 : 0);
        for (let index = 0; index < childCount; index += 1) {
          const angle = (Math.PI * 2 * index / childCount) + Math.random() * 0.45;
          const velocity = 0.014 + Math.random() * 0.025;
          pending.push({
            x: particle.x,
            y: particle.y,
            vx: Math.cos(angle) * velocity,
            vy: Math.sin(angle) * velocity,
            born: now,
            life: 680 + Math.random() * 320,
            size: particle.size * (0.72 + Math.random() * 0.35),
            color: index === 0 ? particle.color : rgb.muted,
            alpha: 0.54 + Math.random() * 0.18,
            kind: 'bubble'
          });
        }
      }

      if (progress < 0.38) {
        ctx.fillStyle = rgba(particle.color, particle.alpha * fade);
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, particle.size * (1 - progress * 0.8), 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.strokeStyle = rgba(particle.color, particle.alpha * fade);
        ctx.lineWidth = 1.25;
        ctx.beginPath();
        ctx.arc(
          particle.x,
          particle.y,
          particle.size * (1.1 + (progress - 0.38) * 2.2),
          0,
          Math.PI * 2
        );
        ctx.stroke();
      }
    } else if (particle.kind === 'bubble') {
      const radius = particle.size * (1.15 + progress * 2.5);
      ctx.fillStyle = rgba(particle.color, particle.alpha * fade * 0.22);
      ctx.beginPath();
      ctx.arc(particle.x, particle.y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = rgba(particle.color, particle.alpha * fade);
      ctx.lineWidth = 1.15;
      ctx.beginPath();
      ctx.arc(particle.x, particle.y, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = rgba(particle.color, particle.alpha * fade * 0.75);
      ctx.beginPath();
      ctx.arc(
        particle.x - radius * 0.28,
        particle.y - radius * 0.28,
        Math.max(0.7, radius * 0.13),
        0,
        Math.PI * 2
      );
      ctx.fill();
    } else {
      ctx.fillStyle = rgba(particle.color, particle.alpha * fade);
      ctx.beginPath();
      ctx.arc(
        particle.x,
        particle.y,
        particle.size * (0.8 + (1 - progress) * 0.25),
        0,
        Math.PI * 2
      );
      ctx.fill();
    }
    return true;
  }

  function drawPulse(pulse, now) {
    const age = now - pulse.born;
    const progress = age / pulse.life;
    if (progress >= 1) return false;

    const ease = 1 - Math.pow(1 - progress, 3);
    const fade = Math.pow(1 - progress, 1.65);
    const radius = 8 + ease * (pulse.strong ? 58 : 42);
    const alpha = (pulse.strong ? 0.72 : 0.48) * fade;

    ctx.save();
    ctx.translate(pulse.x, pulse.y);

    // 主雷達圓環
    ctx.strokeStyle = rgba(rgb.accent, alpha);
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.stroke();

    // 第二圈僅畫 240 度，避免像遊戲準星
    ctx.strokeStyle = rgba(rgb.ink, alpha * 0.68);
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.63, -Math.PI * 0.72, Math.PI * 0.62);
    ctx.stroke();

    // 四象限刻度
    const tickInner = radius + 3;
    const tickOuter = radius + (pulse.strong ? 12 : 9);
    ctx.strokeStyle = rgba(rgb.muted, alpha * 0.82);
    ctx.beginPath();
    ctx.moveTo(tickInner, 0); ctx.lineTo(tickOuter, 0);
    ctx.moveTo(-tickInner, 0); ctx.lineTo(-tickOuter, 0);
    ctx.moveTo(0, tickInner); ctx.lineTo(0, tickOuter);
    ctx.moveTo(0, -tickInner); ctx.lineTo(0, -tickOuter);
    ctx.stroke();

    // 中心資料點
    ctx.fillStyle = rgba(rgb.accent, Math.min(0.92, (pulse.strong ? 0.95 : 0.7) * fade));
    ctx.beginPath();
    ctx.arc(0, 0, 2.3 + (1 - progress) * 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    return true;
  }

  function draw(now) {
    const dt = Math.min(34, now - lastTime || 16.7);
    lastTime = now;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    for (let index = particles.length - 1; index >= 0; index -= 1) {
      if (!drawParticle(particles[index], now, dt)) particles.splice(index, 1);
    }
    if (pending.length) {
      particles.push(...pending.splice(0, pending.length));
      if (particles.length > cfg.maxParticles) {
        particles.splice(0, particles.length - cfg.maxParticles);
      }
    }
    for (let index = pulses.length - 1; index >= 0; index -= 1) {
      if (!drawPulse(pulses[index], now)) pulses.splice(index, 1);
    }

    if (particles.length || pulses.length) {
      frame = requestAnimationFrame(draw);
    } else {
      running = false;
      frame = 0;
    }
  }

  function clear() {
    particles.length = 0;
    pulses.length = 0;
    pending.length = 0;
    if (frame) cancelAnimationFrame(frame);
    frame = 0;
    running = false;
    if (ctx && canvas) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  function destroy() {
    clear();
    window.removeEventListener('resize', resize);
    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerdown', onPointerDown);
    document.removeEventListener('visibilitychange', onVisibility);
    if (canvas) canvas.remove();
    window.__SCAIPointerFXLoaded = false;
  }

  function onVisibility() {
    if (document.hidden) clear();
  }

  function boot() {
    if (!document.body || disabled()) return;
    createLayer();
    window.addEventListener('resize', resize, { passive: true });
    window.addEventListener('pointermove', onPointerMove, { passive: true });
    window.addEventListener('pointerdown', onPointerDown, { passive: true });
    document.addEventListener('visibilitychange', onVisibility);
    reduceQuery.addEventListener?.('change', (event) => {
      if (cfg.respectReducedMotion && event.matches) clear();
    });

    window.SCAIPointerFX = {
      pulse: (x, y, strong = true) => spawnPulse(x, y, strong),
      clear,
      destroy,
      version: '1.1.0'
    };
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, { once: true });
  } else {
    boot();
  }
}());
</script>
</body>
</html>
