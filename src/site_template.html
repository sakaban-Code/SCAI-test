<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta property="og:title" content="SCAI-Agent 半導體前瞻戰略情報">
<meta property="og:description" content="每週判定產業情境、校準 25 項關鍵決策因素、輸出可執行的風險規畫；每日自動巡邏產業訊號並分級警報。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sakaban-code.github.io/SCAI-test/">
<meta property="og:image" content="https://sakaban-code.github.io/SCAI-test/assets/scai-og-1200x630.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://sakaban-code.github.io/SCAI-test/assets/scai-og-1200x630.png">
<link rel="icon" type="image/png" href="assets/scai-logo-light-bg.png">
<link rel="apple-touch-icon" href="assets/scai-logo-light-bg.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Chart.js 自託管（4.4.1，MIT）。原本是 CDN ＋ document.write 本地備援兩行，改為只留同源這行：
     決賽現場網路不可控，CDN 被擋或變慢就沒有圖表，而備援那行要等 CDN 先失敗才會補救。
     ⚠ 這一行是 src/build_offline.py 步驟 3 的錨點（must() 逐字比對且要求命中 1 次）。
        只改這裡不改那裡，下次建離線備援檔會直接 sys.exit。兩邊必須同時改。 -->
<script src="assets/chart.umd.min.js"></script>
<style>
:root{
  color-scheme:light;
  /* ── 海香菇 V3.3 設計代幣（朋友交付之視覺方向；版面與文字仍為本站）── */
  --blue:#006dff; --cyan:#00d4ff; --violet:#7b61ff; --pink:#ff7ac8;
  --glass:rgba(255,255,255,.66); --glass-strong:rgba(255,255,255,.82);
  --brand-gradient:linear-gradient(90deg,#006dff 0%,#5868ff 38%,#8a5cff 67%,#ff7ac8 100%);
  --ocean-gradient:linear-gradient(90deg,#00d4ff 0%,#488cff 50%,#9b88ff 100%);
  --card-shadow:0 14px 42px rgba(84,82,170,.085),inset 0 1px 0 rgba(255,255,255,.92);
  --radius-small:14px; --radius-card:24px; --radius-large:36px;
  --radius-organic:48px; --radius-pill:999px;

  /* ── 既有變數名一律保留、只換值：全站 600 行既有樣式因此自動改色，
        不必逐條改寫。凡在此改動的色票，全部經 contrast.py 分層 alpha 合成
        逐底色驗過 AA，最不利底色是 .brief 的 Hero 面板（rgba(245,235,255,.88)）。 ── */
  --bg:#f7f3ff; --surface:rgba(255,255,255,.85); --ink:#202a3a; --ink2:#3e4a6b;
  /* #8a94b0（朋友原 --muted）在最不利底色僅 2.64，遠低於 AA；加深至 5.24 */
  --muted:#55628a;
  --line:rgba(121,129,218,.16); --line2:rgba(120,130,214,.30); --dim:rgba(120,130,214,.09);
  --accent:#4453d6; --ok:#0d6c86; --warn:#9a5b1e; --err:#b0106a;
  /* 五維色＝海香菇維度色加深版。原值（#4d62ff／#008094／#b85a12／#8c57dc／#d52a88）
     作圖形用途過 3:1，但 .cmp-lab 等處是「文字」需 4.5——加深後兩種用途同時過，
     故只留一組，避免圖表與文字各一套而日後改一邊忘另一邊。 */
  --c1:#3f55ff; --c2:#007689; --c3:#aa5311; --c4:#834ad9; --c5:#c5277e;
  --r:24px; --maxw:1200px; --gut:20px;
  --line-soft:rgba(120,130,214,.09);
  --shadow:0 10px 33px rgba(92,78,172,.065),inset 0 0 0 1px rgba(143,139,235,.05);
  --shadow-hover:0 14px 44px rgba(106,91,198,.105),inset 0 0 0 1px rgba(128,139,255,.07);
  /* 深墨 chrome 全面翻成淺玻璃：海香菇沒有深色外框，側欄／masthead／Snapshot
     一律改玻璃面。變數名不動，值改掉即可讓 header、select、.wbtn、.secnav、
     .brief-mast、.snap 一次全部跟著換。 */
  --ink-bg:rgba(255,255,255,.81); --ink-surface:rgba(255,255,255,.84);
  --ink-line:rgba(121,129,218,.16); --ink-line2:rgba(126,141,213,.30);
  --tx-d:#253668; --tx-d2:#3e4a6b; --mut-d:#55628a; --accent-br:#4453d6;
  --sh1:0 4px 14px rgba(92,78,172,.05);
  --sh2:0 10px 33px rgba(92,78,172,.065),inset 0 0 0 1px rgba(143,139,235,.05);
  --sh3:0 14px 44px rgba(106,91,198,.11),inset 0 0 0 1px rgba(128,139,255,.07);
}
*{box-sizing:border-box}
/* 黏性 header ＝ 工具列 ＋ 分頁列 ＋ 區段列，實測約 149px；錨點捲動須讓開 */
html{scroll-behavior:smooth;scroll-padding-top:156px}
body{margin:0;background:var(--bg);color:var(--ink);
  background-image:radial-gradient(rgba(33,31,28,.05) 1px,transparent 1px);background-size:22px 22px;
  font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
.num,.kt,.pb-id,.ev,select{font-family:"IBM Plex Mono","Noto Sans TC",monospace}
.num{font-variant-numeric:tabular-nums;font-size:.97em}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
a{color:var(--c1)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-9999px;top:0;background:var(--ink);color:#fff;padding:8px 14px;z-index:99;border-radius:0 0 8px 0}
.skip:focus{left:0}

/* ── header + nav ── */
header{position:sticky;top:0;z-index:50;background:var(--ink-bg);
  background-image:radial-gradient(rgba(86,104,255,.16) 1px,transparent 1px);background-size:20px 20px;
  border-bottom:1px solid var(--ink-line)}
.hd{display:flex;align-items:center;justify-content:space-between;height:58px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;flex-shrink:0;display:block;object-fit:contain}
.bn{font-family:"Space Grotesk","Noto Sans TC",sans-serif;font-weight:700;font-size:14.5px;letter-spacing:0;line-height:1.15;white-space:nowrap;color:#253668}
.bs{font-size:10.5px;color:var(--mut-d);white-space:nowrap}
.hr{display:flex;align-items:center;gap:10px}
.stat{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut-d);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);position:relative;flex-shrink:0}
.dot::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:var(--ok);opacity:.18}
@media (prefers-reduced-motion:no-preference){
  .dot::after{animation:pulse 2.6s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.6);opacity:.3}70%,100%{transform:scale(1.6);opacity:0}}
  .rise{opacity:0;animation:rise .45s ease-out forwards}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .d0{animation-delay:0ms}.d1{animation-delay:120ms}.d2{animation-delay:200ms}
  .d3{animation-delay:300ms}.d4{animation-delay:380ms}
}
.wnav{display:flex;align-items:center;gap:5px}
.wbtn{width:28px;height:32px;border:1px solid var(--ink-line2);background:rgba(255,255,255,.62);border-radius:7px;
  cursor:pointer;font-size:13px;color:#55628a;display:flex;align-items:center;justify-content:center;
  transition:border-color .15s,background .15s,color .15s}
.wbtn:disabled{opacity:.35;cursor:default}
.ic{width:14px;height:14px;display:block;fill:none;stroke:currentColor;stroke-width:1.3;
  stroke-linecap:round;stroke-linejoin:round}
.wbtn:not(:disabled):hover{border-color:#7d8ad3;background:#fff;color:#253668}
.vtoggle{display:flex;border:1px solid var(--ink-line2);border-radius:7px;overflow:hidden;flex-shrink:0}
.vtoggle button{border:none;background:transparent;color:var(--mut-d);font-family:inherit;
  font-size:12px;font-weight:500;padding:6px 11px;cursor:pointer;transition:color .15s,background .15s}
.vtoggle button.on{background:var(--accent);color:#fff;font-weight:600}
.vtoggle button:not(.on):hover{color:#253668}
.ngroup{font-size:10px;color:#7d7870;letter-spacing:.5px;padding:9px 4px 9px 10px;white-space:nowrap;align-self:center}
.ndiv{width:1px;align-self:stretch;background:var(--ink-line2);margin:8px 6px}
.ev-d{background:none;border:none;padding:0;margin:10px 0 0;box-shadow:none}
.ev-d summary{display:inline-flex;gap:6px;font-weight:500;font-size:10.5px;color:var(--muted);cursor:pointer}
.ev-d summary::after{content:"＋";font-size:11px}
.ev-d[open] summary::after{content:"−"}
.card{position:relative}
.zoombtn{position:absolute;top:10px;right:10px;z-index:5;border:1px solid var(--line2);
  background:var(--surface);border-radius:6px;font-size:11px;padding:3px 9px;cursor:pointer;
  color:var(--ink2);font-family:inherit}
.zoombtn:hover{border-color:var(--ink2);color:var(--ink)}
.lb{position:fixed;inset:0;z-index:100;background:rgba(33,31,28,.5);display:flex;
  align-items:center;justify-content:center;padding:20px}
.lb[hidden]{display:none}
.lb-box{background:var(--surface);border-radius:12px;width:min(96vw,1400px);height:min(92vh,900px);
  position:relative;padding:48px 22px 22px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.lb-x{position:absolute;top:10px;right:12px;width:32px;height:32px;border:1px solid var(--line2);
  background:var(--surface);border-radius:7px;cursor:pointer;font-size:14px;color:var(--ink2)}
.lb-x:hover{border-color:var(--ink2);color:var(--ink)}
.lb-canvas{position:relative;width:100%;height:100%}
.lb-canvas>canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.wp{position:fixed;inset:0;z-index:110;background:rgba(33,31,28,.4);display:flex;
  align-items:center;justify-content:center;padding:20px}
.wp[hidden]{display:none}
.wp-box{background:var(--surface);border-radius:12px;width:min(92vw,430px);position:relative;
  padding:20px 22px 18px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.wp-t{font-weight:700;font-size:17px}
.wp-t span{font-size:11.5px;color:var(--muted);font-weight:500;margin-left:9px}
.wp-s{color:var(--accent);font-weight:650;font-size:13px;margin-top:3px}
.wp-xy{font-size:12px;color:var(--ink2);margin-top:8px}
.wp-p{font-size:12.5px;color:var(--ink2);line-height:1.7;margin:9px 0}
.wp-m{font-size:11px;color:var(--muted)}
.wp-go{margin-top:12px;border:none;background:var(--ink);color:#fff;border-radius:7px;
  padding:8px 16px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.wp-go:hover{background:#000}
.cmp-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.cmp-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cmp-lab{font-size:11.5px;font-weight:600;width:52px;flex-shrink:0}
.cmp-lab.a{color:var(--c1)}.cmp-lab.b{color:var(--accent)}
.cmp-note{font-size:11px;color:var(--muted);margin-left:4px}
.cmp-line{font-size:12.5px;color:var(--ink2);margin-bottom:12px;line-height:1.7}
.cmp-g{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* ── 週次對比：區間選擇按鈕與面板 ── */
.wpick{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line2);
  background:var(--surface);border-radius:7px;padding:6px 11px;cursor:pointer;
  font-family:inherit;font-size:12.5px;color:var(--ink);
  transition:border-color .18s,background .18s}
.wpick:hover{border-color:var(--ink2)}
.wpick.on{border-color:var(--accent);background:rgba(68,83,214,.07)}
.wpick-v{font-weight:600;font-variant-numeric:tabular-nums}
.wpick-n{font-size:11px;color:#55628a}
.wpick-c{font-size:12px;color:var(--muted);margin-left:2px}
.cmppanel{margin:10px 0 14px;border:1px solid var(--line2);border-radius:8px;
  background:var(--surface);box-shadow:var(--sh2);overflow:hidden}
.cmppanel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;
  border-bottom:1px solid var(--line);background:rgba(255,255,255,.55)}
.cmppanel-h b{font-size:12.5px}
.cmppanel-hint{font-size:11.5px;color:#55628a}
.cmppanel-h .sp{flex:1 1 8px}
.cmppanel-x{border:1px solid var(--line2);background:var(--surface);border-radius:6px;
  width:26px;height:26px;cursor:pointer;color:var(--ink2);font-family:inherit;font-size:12px;
  transition:border-color .18s,color .18s}
.cmppanel-x:hover{border-color:var(--ink2);color:var(--ink)}
.cmppanel-q{width:100%;border:none;border-bottom:1px solid var(--line);padding:10px 14px;
  font-family:inherit;font-size:12.5px;color:var(--ink);background:var(--surface)}
.cmppanel-q:focus{outline:none;border-bottom-color:var(--accent);background:rgba(255,255,255,.92)}
.cmppanel-l{max-height:250px;overflow-y:auto}
.cmppanel-e{padding:16px 14px;font-size:12.5px;color:var(--muted)}
.wrow{display:grid;grid-template-columns:52px 148px 1fr auto;gap:10px;align-items:center;
  width:100%;border:none;border-bottom:1px solid var(--line);background:var(--surface);
  padding:9px 14px;cursor:pointer;font-family:inherit;text-align:left;
  transition:background .16s}
.wrow:last-child{border-bottom:none}
.wrow:hover{background:var(--dim)}
.wrow.in{background:rgba(68,83,214,.07)}
.wrow.lo{background:rgba(68,83,214,.13);box-shadow:inset 2px 0 0 var(--accent)}
.wrow-w{font-weight:600;font-size:12.5px;color:var(--ink)}
.wrow-r{font-size:11.5px;color:var(--ink2)}
.wrow-s{font-size:11.5px;color:#55628a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow-t{font-family:"IBM Plex Mono","Noto Sans TC",monospace;font-size:10px;letter-spacing:.06em;
  color:var(--accent);border:1px solid rgba(68,83,214,.32);border-radius:4px;padding:1px 6px;white-space:nowrap}
.wrow-t.on{color:#55628a;border-color:var(--line2)}
@media(max-width:640px){
  .wrow{grid-template-columns:46px 1fr auto;gap:8px}
  .wrow-s{display:none}
}
.cmp-more{border:1px solid var(--line2);background:var(--surface);border-radius:6px;font-size:11px;
  padding:3px 10px;cursor:pointer;color:var(--ink2);font-family:inherit;margin-top:8px}
.cmp-cell{position:relative;padding-top:26px}
.cmp-more:hover{border-color:var(--ink2)}
@media(max-width:820px){.cmp-g{grid-template-columns:1fr}}
/* 用 100% 而非 100vw／100vh：.lb 已是 position:fixed;inset:0，100vw 會把捲軸
   溝寬也算進去，導致對話框比可視區寬幾個 px。 */
@media(max-width:560px){.lb{padding:0}.lb-box{width:100%;height:100%;border-radius:0}}
select{font-family:"IBM Plex Mono","Noto Sans TC",monospace;font-size:12px;font-weight:500;padding:6px 9px;
  border:1px solid var(--ink-line2);border-radius:7px;background:rgba(255,255,255,.62);color:#253668;
  cursor:pointer;font-variant-numeric:tabular-nums;max-width:200px;transition:border-color .15s,background .15s}
select:hover{border-color:#7d8ad3;background:rgba(255,255,255,.86)}
select option{background:#fff;color:#253668}
nav.secnav{border-top:1px solid var(--ink-line)}
.secnav .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.secnav .wrap::-webkit-scrollbar{display:none}
.secnav a .ni{font-family:"IBM Plex Mono","Noto Sans TC",monospace;font-size:9.5px;
  color:#55628a;margin-right:9px;letter-spacing:.05em}
.secnav a.on .ni{color:var(--accent-br)}
@media(max-width:1099px){.secnav a .ni{display:none}}
.secnav a{color:var(--mut-d);text-decoration:none;font-size:12.5px;font-weight:500;
  padding:9px 12px;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s;position:relative}
.secnav a::after{content:"";position:absolute;left:12px;right:12px;bottom:-2px;height:2px;
  background:var(--accent-br);transform:scaleX(0);transform-origin:left;transition:transform .18s ease-out}
.secnav a:hover{color:#253668}
.secnav a:not(.on):hover::after{transform:scaleX(1)}
.secnav a.on{color:#fff;border-bottom-color:var(--accent-br);font-weight:600}

/* ── sections ── */
main{opacity:1;transition:opacity .18s ease}
main.fade{opacity:0}
section{padding:40px 0 4px}
.sh{display:flex;align-items:baseline;gap:11px;margin-bottom:18px;flex-wrap:wrap}
.sh h2{font-size:18px;font-weight:700;margin:0;letter-spacing:-.3px;text-wrap:balance}
.sh .sub{font-size:12px;color:var(--muted)}
/* ── 簡略模式：藏掉「為什麼這樣設計」的解釋性小字 ─────────────────────
   只藏解釋，不藏揭露。【推斷】、非投資建議、非官方數據、查證連結、鍵盤操作
   說明一律保留——簡略是為了讓不熟系統的人看得懂，不是讓產品少講該講的話。
   逐項理由：dl-note＝零警報為何不落日誌；bt-note＝評判截止與不計命中率之方法
   註記；pd-foot＝三類預測的知識論說明（各則自身的 caveat 仍會顯示，揭露不因此
   消失）；sim-note＝滑桿為何只動部分劇本。四者皆為設計理由，拿掉不影響讀數。 */
body.vs .dl-note,body.vs .bt-note,body.vs .pd-foot,body.vs .sim-note{display:none}
.sh .ix{font-family:"IBM Plex Mono","Noto Sans TC",monospace;font-size:10.5px;font-weight:500;
  color:var(--muted);letter-spacing:.06em;align-self:center;border:1px solid var(--line2);
  border-radius:4px;padding:1px 6px;background:var(--surface);flex-shrink:0}
.sh .q{font-size:12.5px;color:var(--ink2);font-weight:500}
.sh .q::before{content:"問：";color:var(--muted);font-weight:400;letter-spacing:.02em}
.sh::after{content:"";flex:1 1 32px;height:1px;background:var(--line);align-self:center}
/* 微標籤標準（等寬、字距、弱化階）——目前套用於企業畫像指標名 .pf .k */
.mlab,.pf .k{font-family:"IBM Plex Mono","Noto Sans TC",monospace;font-size:10px;
  letter-spacing:.11em;text-transform:uppercase}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:22px 24px}
.card,.pb{box-shadow:var(--sh2)}
.evc,details,.trendsum{box-shadow:none}
.pb,.evc{position:relative;transition:transform .2s ease-out,box-shadow .2s ease-out,border-color .2s ease-out}
.pb::before,.evc::before{content:"";position:absolute;left:16px;top:-1px;width:28px;height:2px;
  background:var(--accent);border-radius:0 0 2px 2px;transform:scaleX(0);transform-origin:left;
  transition:transform .2s ease-out}
details,.card:has(.zoombtn){transition:border-color .2s ease-out,box-shadow .2s ease-out}
@media (hover:hover){
  .pb:hover,.evc:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:var(--sh3)}
  .pb:hover::before,.evc:hover::before{transform:scaleX(1)}
  details:hover{border-color:var(--line2);box-shadow:var(--sh1)}
  .card:has(.zoombtn):hover{border-color:var(--line2)}
  .card:has(.zoombtn):hover .zoombtn{border-color:var(--ink2);color:var(--ink)}
  tbody tr:hover td{background:rgba(68,83,214,.06)}
  .fchip:hover{transform:translateY(-1px);border-color:var(--ink2)}
  .src a:hover .arw,.evc .f a:hover .arw{transform:translate(3px,-2px)}
}
.fchip{transition:transform .18s ease-out,border-color .18s}
.fchip:active{transform:translateY(0)}
.fchip:focus-visible,.zoombtn:focus-visible,.cmp-more:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.zoombtn,.cmp-more{transition:border-color .18s,color .18s}
.arw{display:inline-block;transition:transform .18s ease-out}
header :focus-visible{outline-color:var(--accent-br)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}
tbody td{transition:background .12s}
::selection{background:rgba(164,74,36,.16)}
.chip{display:inline-block;border:1px solid var(--line2);color:var(--muted);border-radius:5px;
  padding:1px 7px;font-size:10.5px;font-weight:500;vertical-align:middle}
.tbc{background:#fdf6ec;border:1px solid #f0dcc0;color:#8a6420;border-radius:5px;
  padding:1px 6px;font-size:10px;font-weight:500;white-space:nowrap}
.chip.cc{border-color:#bfe0cd;color:var(--ok);background:#eef7f1}
.chip.cc.lo{border-color:#f0cdc9;color:var(--err);background:#fdf1ef}
.heroflag{background:#fdf6ec;border:1px solid #f0dcc0;color:#8a6420;border-radius:8px;
  padding:8px 12px;font-size:12px;margin:0 0 14px;line-height:1.6;
  display:flex;align-items:flex-start;gap:8px}
.heroflag .wi{flex-shrink:0;margin-top:2px;stroke-width:1.5}
.audit{margin-top:16px;border-top:1px solid var(--line);padding-top:13px;font-size:12px;color:var(--muted);line-height:1.8}
.audit table{width:auto;font-size:11.5px;margin-top:6px}
.audit td,.audit th{padding:4px 14px 4px 0;border-bottom:1px solid var(--line)}
.audit tr:last-child td{border-bottom:none}
.trendsum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 18px;margin-bottom:16px;font-size:12.5px;color:var(--ink2);line-height:1.7;box-shadow:var(--shadow)}
.trendsum b{color:var(--ink)}

/* ── hero ── */
/* ⚠ 不可加回 display——<section> 本來就是 block，這裡宣告它沒有作用，
   卻會壓過瀏覽器預設樣式表的 [hidden]{display:none}（UA 樣式一律輸給任何作者規則，
   與特異性無關），使總覽區段在切到其他分頁時關不掉、疊在別頁內容上方。
   2026-08-24 修，成因存在數週未被發現：先前只驗 s.hidden 屬性為 true，沒驗計算後的 display。 */
.hero{padding-top:22px}
/* 把「隱藏的區段不得顯示」寫成明確規則，而不是依賴 UA 樣式：
   (1,1,1) 壓得過任何 .class 規則，日後誰在 section 上加 display 都不會再破掉分頁互斥。 */
#main section[hidden]{display:none}
.eyebrow{font-size:11.5px;color:var(--muted);letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.scen{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.scen-en{font-family:"Space Grotesk","Noto Sans TC",sans-serif;font-size:clamp(30px,4.2vw,40px);font-weight:700;letter-spacing:-.5px;color:var(--accent);line-height:1.06}
.scen-zh{font-size:14.5px;font-weight:500;color:var(--ink2)}
.verdict{color:var(--ink2);font-size:13.5px;margin:0 0 19px;line-height:1.7;max-width:65ch}
.plain{background:var(--dim);border-radius:8px;padding:9px 13px;font-size:13px;color:var(--ink);
  margin:0 0 12px;line-height:1.7;max-width:65ch}
.plain b{color:var(--accent-ink,var(--accent))}
.axword{display:inline-block;background:var(--dim);border-radius:5px;padding:0 7px;
  font-size:10.5px;font-weight:500;color:var(--ink2);margin-left:5px;vertical-align:1px}
.axes{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.ax-t{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:6px;gap:8px}
.ax-v{color:var(--ink);font-weight:650;font-size:13px;white-space:nowrap}
.delta{font-size:10.5px;font-weight:500}
.up{color:var(--ok)}.dn{color:var(--err)}
.bar{position:relative;height:6px;background:var(--dim);border-radius:3px}
.bar i{position:absolute;top:0;bottom:0;left:0;border-radius:3px;transition:width .5s ease}
.bar .mk{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line2)}
.ax-f{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:5px}
.side{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column}
.side h3{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.4px;margin:0 0 12px}
.act{display:flex;gap:10px;margin-bottom:10px;font-size:12.5px;line-height:1.55;color:var(--ink2)}
.act b{font-weight:650;margin-right:4px}
.act .i{flex-shrink:0;font-size:11px;line-height:1.7}
.act.y b,.act.y .i{color:var(--ok)}
.act.n b,.act.n .i{color:var(--err)}
.side .foot{border-top:1px solid var(--line);margin-top:auto;padding-top:11px;font-size:11px;color:var(--muted);line-height:1.7}

/* ── 第 9 輪｜本週策略簡報封面（Executive Brief）＋ Snapshot 讀數面板 ── */
.brief{position:relative;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:12px;box-shadow:var(--sh3);overflow:hidden}
.brief-mast{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--ink-bg);
  padding:8px 24px;border-bottom:1px solid var(--ink-line)}
.brief-mast .ix{font-family:"IBM Plex Mono","Noto Sans TC",monospace;font-size:10.5px;font-weight:500;
  color:var(--tx-d2);letter-spacing:.06em;border:1px solid var(--ink-line2);border-radius:4px;
  padding:1px 6px;background:rgba(255,255,255,.62);flex-shrink:0}
.brief-mast .mt{font-size:12.5px;font-weight:700;letter-spacing:.1em;color:#253668}
.brief-mast .mn{font-family:"IBM Plex Mono","Noto Sans TC",monospace;font-size:11px;
  color:var(--mut-d);letter-spacing:.03em}
.brief-mast .sp{flex:1 1 8px}
.brief-mast .chip{border-color:var(--ink-line2);color:var(--mut-d);background:rgba(255,255,255,.62)}
.brief-mast .chip.cc{background:rgba(14,116,144,.10);border-color:rgba(14,116,144,.34);color:#0d6c86}
.brief-mast .chip.cc.lo{background:rgba(176,16,106,.09);border-color:rgba(176,16,106,.32);color:#b0106a}
.brief-body{display:grid;grid-template-columns:repeat(12,minmax(0,1fr))}
.brief-main{grid-column:span 8;position:relative;padding:24px 24px 20px;min-width:0}
.brief-main>*{position:relative;z-index:2}
.brief-fx{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.brief-fx i{position:absolute;inset:0;display:block}
/* 底紋圖已於海香菇改版換成 hero 海香菇群（見下方版面層的同名規則）。
   此處直接改字串而非只在後面覆蓋——留著舊 url 會讓 build_offline 白白內嵌
   98 KB 用不到的 png。 */
.brief-fx .pat{background:url("assets/hero-mushroom-cluster-v4.webp") right -18px center/auto 152% no-repeat;
  opacity:.4;transform:translate3d(var(--px,0px),var(--py,0px),0);transition:transform .32s ease-out;
  /* 硬性限制在右側外圍：左半完全遮掉，確保不干擾文字（人類指示） */
  -webkit-mask-image:linear-gradient(to left,#000 0,rgba(0,0,0,.45) 26%,transparent 52%);
  mask-image:linear-gradient(to left,#000 0,rgba(0,0,0,.45) 26%,transparent 52%)}
.brief-fx .dots{background-image:radial-gradient(rgba(33,31,28,.22) 1px,transparent 1px);
  background-size:18px 18px;opacity:0;transition:opacity .3s ease-out;
  -webkit-mask-image:radial-gradient(190px circle at var(--mx,-999px) var(--my,-999px),#000,transparent 72%);
  mask-image:radial-gradient(190px circle at var(--mx,-999px) var(--my,-999px),#000,transparent 72%)}
.brief-fx .glow{background:radial-gradient(260px circle at var(--mx,-999px) var(--my,-999px),
  rgba(164,74,36,.05),rgba(164,74,36,0) 70%);opacity:0;transition:opacity .3s ease-out}
.brief.fx .dots{opacity:.6}
.brief.fx .glow{opacity:1}
.snap{grid-column:span 4;background:var(--ink-surface);color:var(--tx-d);padding:16px 20px;
  border-left:1px solid var(--ink-line);display:flex;flex-direction:column;min-width:0}
.snap h3{margin:0 0 12px;font-size:11.5px;font-weight:700;letter-spacing:.08em;color:#3e4a6b}
.sr-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;
  border-top:1px solid var(--ink-line)}
.sr-row:first-of-type{border-top:none;padding-top:0}
.sr-k{font-size:11px;color:var(--mut-d);white-space:nowrap}
.sr-v{font-family:"IBM Plex Mono","Noto Sans TC",monospace;font-size:12.5px;font-weight:500;
  color:#253668;font-variant-numeric:tabular-nums;text-align:right;line-height:1.45}
.sr-v .u{color:#0d6c86}.sr-v .d{color:#b0106a}
.sr-v .sm{font-family:"Noto Sans TC",sans-serif;font-size:11px;color:var(--tx-d2);margin-left:5px}
.snap .note{margin-top:auto;padding-top:10px;border-top:1px solid var(--ink-line);font-size:10.5px;
  color:var(--mut-d);line-height:1.6}

/* ── 立即行動建議帶（獨立層級，非 hero 側欄） ── */
.actband{margin-top:14px;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--r);box-shadow:var(--sh2);overflow:hidden}
.actband-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;
  border-bottom:1px solid var(--line);background:rgba(255,255,255,.55)}
.actband-h b{font-size:13.5px;font-weight:700}
.actband-h .q{font-size:12.5px;color:var(--ink2);font-weight:500}
.actband-h .q::before{content:"問：";color:var(--muted);font-weight:400}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.act{display:flex;gap:8px;margin:0;padding:16px 20px;font-size:12.5px;line-height:1.6;
  color:var(--ink2);border-left:1px solid var(--line)}
.act:first-child{border-left:none}
.act b{display:block;font-family:"IBM Plex Mono","Noto Sans TC",monospace;font-size:10px;
  font-weight:600;letter-spacing:.1em;color:var(--muted);margin:0 0 3px}
.act .i{flex-shrink:0;font-size:11px;line-height:1.9}
.act.y .i{color:var(--ok)}.act.y b{color:var(--ok)}
.act.n .i{color:var(--err)}.act.n b{color:var(--err)}
.actband-f{padding:8px 20px;border-top:1px solid var(--line);background:rgba(255,255,255,.5);
  font-size:11.5px;color:var(--muted);line-height:1.7}
.actband-f b{color:var(--ink)}

/* ── 觸發依據（✓/✗ 標記強化，判斷內容不變） ── */
.tk{display:inline-block;font-weight:700;border-radius:3px;padding:0 3px;margin-right:1px}
.tk.ok{color:#1f5c40;background:#e6f2ea}
.tk.no{color:#8a2f28;background:#fbeae7}

/* ── movers ── */
.movers{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mv{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mv:last-child{border-bottom:none}
.mv .arrow{font-size:12px;width:16px;text-align:center;flex-shrink:0;margin-top:2px}
.mv .body{min-width:0}
.mv .t{font-size:12.5px;font-weight:600}
.mv .t .num{color:var(--muted);font-weight:500;margin-left:6px}
.mv .why{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:1px}

/* ── plan ── */
.plan{display:grid;gap:12px}
.pb{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:17px 19px}
.pb-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.hz{background:var(--dim);border-radius:5px;padding:2px 8px;font-size:10.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.pb-t{font-weight:650;font-size:13.5px}
.pb-id{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pb-a{font-size:13px;color:var(--ink2);margin-bottom:12px;line-height:1.65}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px;border-top:1px solid var(--line);padding-top:11px}
.mi .k{font-size:10.5px;color:var(--muted);margin-bottom:2px}
.mi .v{font-size:11.5px;color:var(--ink2);line-height:1.5}
.ev{font-size:10.5px;color:var(--muted);margin-top:10px;font-variant-numeric:tabular-nums;
  background:rgba(255,255,255,.64);border:1px solid var(--line);border-radius:6px;padding:8px 10px;line-height:1.75}

/* ── tables ── */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.4px;
  padding:0 12px 9px 0;border-bottom:1px solid var(--line2)}
td{padding:12px 12px 12px 0;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:top;line-height:1.55}
tr:last-child td{border-bottom:none}
td.risk-t{color:var(--ink);font-weight:500}
.sev{display:inline-block;width:3px;height:12px;border-radius:2px;margin-right:8px;vertical-align:-1px}
.sev.h{background:var(--err)}.sev.m{background:var(--warn)}
.kt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px;white-space:nowrap}

/* ── charts ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cbox{position:relative;width:100%}
.cbox>canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.cap{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.55}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
.fchip{border:1px solid var(--line2);background:var(--surface);color:var(--ink2);border-radius:999px;
  padding:4px 12px;font-size:11.5px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.fchip .sw{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.fchip.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.fchip:hover{border-color:var(--ink2)}

/* ── events ── */
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px}
.evc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:15px 17px;display:flex;flex-direction:column;gap:8px}
.evc .t{font-weight:600;font-size:13px;line-height:1.5}
.evc .s{font-size:12px;color:var(--ink2);line-height:1.6;flex:1}
.evc .f{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--muted);flex-wrap:wrap}
.imp{border-radius:5px;padding:1px 7px;font-size:10px;font-weight:600;background:var(--dim);color:var(--ink2)}
.imp.d{color:var(--err)}.imp.u{color:var(--ok)}

/* ── trace ── */
details{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:15px 19px;margin-bottom:8px}
summary{cursor:pointer;font-weight:550;font-size:13px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--muted);font-size:14px;flex-shrink:0}
summary:hover{color:var(--accent)}
details[open] summary::after{content:"−"}
.tr-b{margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
.kws{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.kw{background:var(--dim);border-radius:5px;padding:2px 8px;font-size:10.5px;color:var(--ink2)}
.kdfc{font-size:12px;color:var(--ink2);margin-bottom:5px;line-height:1.6}
.kdfc b{font-variant-numeric:tabular-nums;color:var(--ink)}
.src{font-size:11px;color:var(--muted);margin-top:9px}
.src a{text-decoration:none}
.src a:hover{text-decoration:underline}

/* ── §12 自我稽核 ── */
.sa-list{display:grid;gap:12px}
.sa{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.sa-h{display:flex;gap:10px;align-items:baseline;margin-bottom:12px}
.sa-n{font-family:"IBM Plex Mono","Noto Sans TC",monospace;font-size:11px;color:#55628a;
  border:1px solid var(--line2);border-radius:4px;padding:1px 6px;flex-shrink:0}
.sa-h b{font-size:13.5px;font-weight:650;line-height:1.6}
.sa-r{display:grid;grid-template-columns:82px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.sa .k{font-family:"IBM Plex Mono","Noto Sans TC",monospace;font-size:10px;letter-spacing:.06em;
  color:#55628a;line-height:1.9}
.sa .v{font-size:12.5px;color:var(--ink2);line-height:1.75}
.sa-d{display:grid;grid-template-columns:82px 1fr;gap:12px;margin-top:12px;padding:10px 12px;
  background:#fdf6ec;border:1px solid #f0dcc0;border-radius:6px}
.sa-d .k{color:#8a6420}
.sa-d .v{color:#6b4f18}
@media(max-width:640px){
  .sa-r,.sa-d{grid-template-columns:1fr;gap:2px}
  .sa .k{line-height:1.6}
}

/* ── profile ── */
.pf{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.pf .it{border:1px solid var(--line-soft);border-radius:8px;padding:13px 15px;background:var(--surface);box-shadow:var(--shadow)}
.pf .k{font-size:10.5px;color:var(--muted);margin-bottom:4px}
.pf .v{font-family:"Space Grotesk","Noto Sans TC",sans-serif;font-size:16px;font-weight:700;letter-spacing:0;font-variant-numeric:tabular-nums}
.pf .n{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.5}

/* ── methodology ── */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}
.sc-card{border:1px solid var(--line-soft);border-radius:var(--r);padding:16px 17px;background:var(--surface);box-shadow:var(--shadow)}
.sc-card.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sc-card .n{font-weight:650;font-size:13.5px;margin-bottom:2px}
.sc-card .st{font-size:10.5px;color:var(--muted);margin-bottom:8px}
.sc-card .m{font-size:11.5px;color:var(--ink2);line-height:1.65}
.sc-card .now{display:inline-block;background:var(--accent);color:#fff;border-radius:5px;padding:1px 7px;font-size:10px;font-weight:600;margin-left:6px;vertical-align:1px}
.axbox{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:13px}
.axc{border:1px solid var(--line-soft);border-radius:var(--r);padding:15px 17px;background:var(--surface);box-shadow:var(--shadow)}
.axc .t{font-weight:650;font-size:12.5px;margin-bottom:5px}
.axc .d{font-size:11.5px;color:var(--ink2);line-height:1.65}
.dims{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.dimtag{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:11.5px;color:var(--ink2);background:var(--surface)}
.dimtag .sw{width:8px;height:8px;border-radius:50%}

/* ── misc ── */
/* 只用 opacity:0 隱藏會留下「看不見卻仍可聚焦」的按鈕；補 visibility 使其
   同時退出 Tab 順序與無障礙樹（visibility 延到淡出結束才切換，保住轉場）。 */
#top{position:fixed;right:20px;bottom:20px;width:38px;height:38px;border-radius:50%;
  background:var(--ink);color:#fff;border:none;cursor:pointer;font-size:15px;opacity:0;
  visibility:hidden;pointer-events:none;transition:opacity .25s,visibility 0s linear .25s;z-index:40}
#top.show{opacity:.85;visibility:visible;pointer-events:auto;transition:opacity .25s,visibility 0s}
#top:hover{opacity:1}

/* ── B＋F｜側欄辦公佈局：header 轉左側固定欄，週次控制成工具列（DOM 零改動） ── */
@media(min-width:1100px){
  body{padding-left:238px}
  html{scroll-padding-top:24px}
  header{position:fixed;top:0;left:0;bottom:0;width:238px;display:flex;flex-direction:column;
    border-bottom:none;border-right:1px solid var(--ink-line);overflow:hidden auto}
  .hd,.hr{display:contents}
  /* order 的排法對齊 DOM 的可聚焦順序（檢視切換 → 週次 → 區段導覽），
     否則 Tab 會從視覺上最下方的檢視切換開始、再跳回上方的週次控制。
     改視覺而非改 DOM：DOM 一動會連帶影響 600–1100px 與 ≤600px 兩個版型。 */
  .brand{order:1;padding:18px 16px 14px}
  .wnav{order:3;margin:2px 14px 6px;padding:9px 10px;background:rgba(255,255,255,.6);
    border:1px solid var(--ink-line);border-radius:8px;flex-wrap:wrap}
  /* 選單獨佔第一列、四顆鈕落第二列。238px 側欄扣掉邊距內距只剩 206px 內容寬，
     四顆鈕就吃掉 132px，單行時選單僅 56px——「W9　2026/08/04–08/10」需 172px，
     W10 起更需 180px，永遠塞不下。獨佔一列後為 188px。 */
  #wsel{flex:1 0 100%;min-width:0;max-width:none;margin-bottom:6px}
  nav.tabnav{order:4;border-top:1px solid var(--ink-line);margin-top:6px}
  .tabnav .wrap{flex-direction:column;padding:8px 10px 4px;gap:1px;overflow:visible}
  .tb{width:100%;border-bottom:none;border-left:2px solid transparent;border-radius:0 6px 6px 0;padding:6px 12px}
  .tb.on{border-left-color:var(--accent-br)}
  nav.secnav{order:5;flex:1;border-top:1px solid var(--ink-line);margin-top:6px}
  .secnav .wrap{flex-direction:column;padding:10px 10px 12px;gap:1px;overflow:visible}
  /* ⚠ white-space:normal 必須在此覆蓋：.secnav a 全域是 nowrap，那是給 <1100px
     的**橫向**分頁列用的（一列橫捲，斷行會破版）。側欄是直向 block，繼承 nowrap
     會讓長提示撐出 238px 側欄，再被 header 的 overflow:hidden 裁掉——實測最長的
     「任務分派、記憶、工具、護欄、可觀測性、評估」被切 30px。改為正常斷行。 */
  .secnav a{display:block;padding:7px 12px;border-bottom:none;border-left:2px solid transparent;border-radius:0 6px 6px 0;white-space:normal}
  .nh{display:block;font-size:9.5px;line-height:1.45;color:#55628a;margin-top:2px}
  .secnav a::after{display:none}
  .secnav a:hover{background:rgba(255,255,255,.72)}
  .secnav a.on{background:rgba(68,83,214,.10);border-left-color:var(--accent-br)}
  .ngroup{padding:14px 12px 5px;letter-spacing:1px}
  .ndiv{display:none}
  .vtoggle{order:2;margin:0 16px 10px;display:flex}
  .vtoggle button{flex:1;padding:7px 11px}
  .stat{order:6;margin:auto 16px 0;padding:12px 2px 16px;border-top:1px solid var(--ink-line)}
}

/* header 改雙行。原本 .hd 是固定 58px 的 nowrap 單行，min-content 需求 580px：
   窄於此時 .brand（min-width:0）被壓成 0 寬，其 logo 與站名以 overflow:visible 溢出疊在
   .vtoggle 上，且 .wnav 右緣衝出畫面。以 .hr{display:contents} 攤平（同 ≥1100px 側欄手法），
   第一行品牌＋檢視切換、第二行週次控制整條。斷點取 600 而非 560，否則 561–580 仍會破。 */
@media(max-width:600px){
  /* 內距用縱向 longhand：三值簡寫 padding:10px 0 11px 會把 .wrap 的水平內距一併歸零，
     header 整條貼齊螢幕邊緣（brand 左緣 0），且 .wnav 滿版後 space-between 的零頭
     造成全頁 4px 橫向捲動。改 longhand 後 .wrap 的 24px／≤560px 的 16px 自然生效。 */
  .hd{height:auto;flex-wrap:wrap;row-gap:9px;padding-top:10px;padding-bottom:11px}
  .hr{display:contents}
  .brand{flex:1 1 auto;min-width:0}
  .vtoggle{flex:0 0 auto}
  /* min-width:0 不可省：flex item 預設 min-width:auto，會卡在 min-content 不肯縮。
     ≤340px 時三顆鈕＋選單的 min-content 大於可用寬，.wnav 會撐破容器（320px 實測溢出 6.2px）。 */
  .wnav{flex:1 0 100%;min-width:0;justify-content:space-between}
  /* max-width:none 不可省：base 的 select 有 max-width:200px，少了這句 flex:1 撐不開，
     剩餘空間會跑去 space-between 的空隙（實測撐成 20.4px，宣告值是 5px）。
     同一意圖在 ≥1100px 側欄的 #wsel 已寫成 max-width:none，此處對齊。 */
  .wnav select{flex:1 1 auto;min-width:0;max-width:none}
  /* 手機黏性 header 已佔 23% 螢幕高；收起分頁鈕副標省一行，標籤本身已足夠白話 */
  .tb-h{display:none}
  .tb{padding:9px 13px}
  html{scroll-padding-top:186px}
}
@media print{
  /* 加 !important：助理的 #aifab/#aipanel 規則在本區塊之後、同特異性會蓋回 display:flex */
  header,nav.secnav,#top,.wnav{display:none}
  #aifab,#aipanel{display:none!important}
  /* 分頁以 hidden 藏起的區段在列印時全部攤開，否則只印得出當前分頁 */
  #main section[hidden]{display:block}
  body{background:#fff;font-size:12px;padding-left:0}

  .brief,.actband{box-shadow:none;border-color:#bbb}

  section{padding:16px 0 0}

   海香菇 V3.3 版面層（2026-08-18）
   同學與教授三案選 C（全海香菇版）。C 的預覽 dashboard/preview4.html 是把
   11 區段 × 9 週預先烤成 99 段靜態 HTML 的「比較用」產物，不能直接上線：
   零 section id、hero-module／summary-module 各重複 9 次、無圖表／區間對比／
   放大檢視／AI 面板／鍵盤模態／safeUrl 注入防線／離線建置路徑。
   故改為把 C 的版面與視覺回寫進本模板，既有功能一項不減。
   本層置於樣式表最末，刻意覆蓋前面所有分區規則（含 ≥1100px 舊側欄佈局）。
   ══════════════════════════════════════════════════════════════════════════ */

/* ── 底層：頁面漸層與粒點紋（取自 V3.3 base.css）── */
html{min-height:100%;background:#f7f3ff;scroll-padding-top:20px}
body{min-width:320px;overflow-x:hidden;padding-left:0;
  background-color:#f7f3ff;
  background-image:
    radial-gradient(ellipse at 48% -4%,rgba(181,166,255,.36),transparent 31%),
    radial-gradient(circle at 84% 24%,rgba(255,178,223,.30),transparent 31%),
    radial-gradient(circle at 7% 91%,rgba(123,202,255,.30),transparent 29%),
    linear-gradient(124deg,#fff 0%,#fff9fd 33%,#f8f2ff 68%,#f2f8ff 100%);
  background-attachment:fixed}
/* 粒點紋改用 ::before，body 的 background-image 已被上面四層漸層佔滿 */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.18;
  background-image:radial-gradient(rgba(86,104,255,.20) .55px,transparent .7px);
  background-size:26px 26px;
  -webkit-mask-image:linear-gradient(118deg,#000,transparent 73%);
  mask-image:linear-gradient(118deg,#000,transparent 73%)}
.ambient-wash{position:fixed;z-index:-1;border-radius:50%;pointer-events:none;filter:blur(3px)}
.wash-a{width:360px;height:360px;right:-145px;top:8%;
  background:radial-gradient(circle,rgba(255,126,202,.19),transparent 68%)}
.wash-b{width:330px;height:330px;left:6%;bottom:-155px;
  background:radial-gradient(circle,rgba(0,192,255,.16),transparent 68%)}

/* ── 玻璃外框：側欄 ＋ 工作區兩欄 ── */
.product-frame{position:relative;isolation:isolate;display:grid;
  grid-template-columns:238px minmax(0,1fr);gap:10px;
  width:min(1320px,calc(100% - 24px));margin:12px auto;padding:0 8px 8px;
  border:1px solid rgba(255,255,255,.96);border-radius:41px;
  background-color:rgba(255,255,255,.55);
  background-image:
    radial-gradient(circle at 51% 0%,rgba(168,146,255,.18),transparent 28%),
    linear-gradient(145deg,rgba(255,255,255,.55),rgba(255,245,252,.40) 55%,rgba(240,246,255,.42));
  box-shadow:0 30px 100px rgba(101,79,180,.105),inset 0 1px 0 #fff;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
/* overflow 不設 hidden：C 的預覽可以，因為它整頁不捲；本站區段很長，
   一旦 hidden 就會把 sticky 側欄的黏著容器裁掉，側欄跟著捲走。 */
.product-frame::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  border-radius:inherit;
  background:
    radial-gradient(circle at 65% 24%,rgba(0,199,255,.08),transparent 22%),
    radial-gradient(circle at 73% 70%,rgba(255,102,199,.09),transparent 28%)}
/* 角落海香菇：獨立一層裁切容器。
   ⚠ 不可改成在 .product-frame 上加 overflow:hidden——那會讓外框成為
   sticky 側欄的捲動容器並把它裁掉，側欄第二屏就消失。
   實測：不裁切時 corner-right 右緣達 1338px（視窗 1280），造成全頁橫向捲動。 */
.frame-deco{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  border-radius:inherit}
/* height:auto 不可省：img 帶 height="400" 屬性，只給 CSS width 會留下 310×400 的
   盒子（圖本身 1200×400，contain 後只佔 310×103），下緣多出近 300px 的空盒。 */
.corner-habitat{position:absolute;pointer-events:none;object-fit:contain;height:auto;
  filter:saturate(.92) brightness(1.07) drop-shadow(0 16px 25px rgba(78,87,219,.13))}
.corner-left{left:-70px;bottom:-65px;width:310px;opacity:.42}
.corner-right{right:-86px;bottom:-76px;width:285px;opacity:.28;transform:scaleX(-1)}
/* wash-a 是 position:fixed 且 right:-145px，本身不撐文件寬，但仍以 clip 保險 */
.ambient-wash{clip-path:inset(0)}

/* ── header → 玻璃側欄（取代舊的深墨固定欄）── */
header{position:sticky;top:12px;align-self:start;z-index:4;
  width:auto;max-height:calc(100vh - 24px);
  display:flex;flex-direction:column;padding:17px 12px 14px;
  overflow:hidden auto;overscroll-behavior:contain;
  border:0;border-radius:34px;
  background-color:rgba(255,255,255,.81);
  background-image:linear-gradient(180deg,rgba(255,255,255,.81),rgba(255,249,253,.64));
  box-shadow:0 15px 50px rgba(104,88,190,.075),inset -1px 0 rgba(159,147,255,.08)}
/* sticky 而非 C 原本的靜態欄：C 的預覽一次只顯示一個區段所以不會捲，
   本站 11 個區段連續呈現，靜態側欄會在第二屏就消失、導覽再也點不到。
   視覺仍是 C 的玻璃長欄，只是捲動時跟著。 */
.product-frame .wrap{max-width:none;margin:0;padding:0}
.hd,.hr{display:contents}
.brand{order:1;display:flex;align-items:center;gap:9px;padding:0 4px 12px;min-height:74px}
.brand-emblem{width:52px;height:58px;flex:none;object-fit:contain;
  filter:saturate(.98) brightness(1.05) drop-shadow(0 8px 12px rgba(101,80,240,.16))}
.bn{color:#253b80;font-size:17px;font-weight:900;letter-spacing:-.035em;line-height:1.1}
.bs{color:#55628a;font-size:9.7px;font-weight:600;margin-top:1px}
.vtoggle{order:2;display:flex;margin:0 2px 10px;border:1px solid var(--ink-line2);
  border-radius:var(--radius-pill);overflow:hidden;background:rgba(255,255,255,.62)}
.vtoggle button{flex:1;padding:7px 11px;color:#55628a}
.vtoggle button.on{background:#5263ed;color:#fff;font-weight:700;
  box-shadow:0 7px 16px rgba(123,97,255,.23)}
.wnav{order:3;display:flex;align-items:center;flex-wrap:wrap;gap:5px;
  margin:0 2px 8px;padding:9px 10px;border-radius:18px;
  background:rgba(255,255,255,.66);border:1px solid rgba(126,141,213,.10);
  box-shadow:inset 0 1px rgba(255,255,255,.95)}
#wsel{flex:1 0 100%;min-width:0;max-width:none;margin-bottom:6px}
select{border-radius:12px;border-color:rgba(126,141,213,.22);color:#3e4a6b}
.wbtn{width:33px;height:33px;border-radius:50%;border-color:rgba(126,141,213,.14);color:#55628a}
.wbtn:not(:disabled):hover{transform:translateY(-2px);
  box-shadow:0 8px 18px rgba(88,81,170,.11)}
nav.tabnav{display:none}   /* 分頁列改掛到工作區的 topbar，見下方 .topbar */
nav.secnav{order:5;flex:1 1 auto;border-top:1px solid var(--ink-line);
  margin-top:6px;padding-top:8px}
.secnav .wrap{display:grid;gap:4px;padding:2px 0 8px;overflow:visible}
.secnav a{display:block;min-height:38px;padding:8px 13px;border:0;
  border-radius:var(--radius-pill);color:#55618c;font-weight:650;
  text-decoration:none;transition:200ms ease}
.secnav a::after{display:none}
.secnav a:hover{color:#3e4a6b;background:rgba(255,255,255,.72);transform:translateX(2px)}
.secnav a.on{color:#fff;background:#5263ed;font-weight:700;
  box-shadow:0 9px 24px rgba(123,97,255,.21),inset 0 1px 0 rgba(255,255,255,.28)}
/* 不可用 rgba(255,255,255,.86)：在 #5263ed 上只有 4.00。純白為 4.81，
   層級改由字級（9.5px vs 12.5px）表達，不靠降低對比。 */
.secnav a.on .ni,.secnav a.on .nh{color:#fff}
.secnav a .ni{color:#55628a}
.ngroup{padding:14px 12px 5px;letter-spacing:1px;color:#55628a}
.ndiv{display:none}
.stat{order:6;margin:auto 4px 0;padding:12px 6px 4px;border-top:1px solid var(--ink-line);
  color:#55628a}

/* ── 工作區 ── */
.workspace{position:relative;z-index:3;min-width:0;padding-bottom:8px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:49px;padding:0 6px}
.topbar .tabnav{display:block;border:0;margin:0;min-width:0;flex:1 1 auto}
/* flex-direction 必須明寫：舊模板 @media(min-width:1100px) 有
   .tabnav .wrap{flex-direction:column}（那時分頁列在直向側欄裡），
   不覆蓋會讓五個分頁在 topbar 內直向堆疊成 174px 高。 */
.topbar .tabnav .wrap{display:flex;flex-direction:row;align-items:center;
  gap:clamp(8px,1.15vw,18px);min-width:0;overflow-x:auto;scrollbar-width:none;padding:0}
.topbar .tabnav .wrap::-webkit-scrollbar{display:none}
/* width:auto 不可省：舊模板 @media(min-width:1100px) 有 .tb{width:100%}（分頁列
   當時在直向側欄裡），不覆蓋的話五個分頁各自撐成容器全寬 963px、scrollWidth 4875，
   實際只看得到第一個。全頁不會橫向捲動（外層有 overflow-x:auto），所以純看截圖
   不一定察覺——是溢出檢查抓到的。 */
.tb{flex-direction:row;align-items:center;gap:7px;flex:none;width:auto;padding:0;
  border:0;background:transparent;color:#596182;font-size:10px;font-weight:750;
  white-space:nowrap}
.tb::before{content:counter(tbn,decimal-leading-zero);counter-increment:tbn;
  display:grid;place-items:center;width:23px;height:23px;border-radius:50%;
  color:#5245cf;background:rgba(132,116,255,.11);font-size:9px;font-weight:800;flex:none}
.topbar .tabnav .wrap{counter-reset:tbn}
.tb.on{background:transparent;border:0;color:#465987}
.tb.on::before{color:#fff;background:#5263ed;box-shadow:0 7px 16px rgba(123,97,255,.23)}
.tb .tb-l{font-size:11px;font-weight:750;color:inherit}
.tb.on .tb-l{color:#465987}
.tb:not(.on):hover .tb-l{color:#3e4a6b}
.tb-h{display:none}
.top-tools{display:flex;align-items:center;gap:7px;padding-left:12px;color:#55628a;
  font-size:9px;white-space:nowrap}

/* ── 主要內容：卡片一律換成海香菇的玻璃圓角 ── */
main{padding-top:2px}
section{padding:22px 0 2px}
.sh h2{color:#253668;font-weight:850;letter-spacing:-.02em}
.sh::after{background:var(--line)}
.card,.pb,.evc,details,.sa,.sc-card,.axc,.trendsum,.cmppanel,.actband,.brief,.wp-box,.lb-box{
  border-radius:var(--radius-card);border-color:rgba(255,255,255,.92)}
.card,.pb,.evc,.sa,.sc-card,.axc{
  background-color:rgba(255,255,255,.85);
  background-image:linear-gradient(155deg,rgba(255,255,255,.85),rgba(255,250,254,.71));
  box-shadow:0 10px 33px rgba(92,78,172,.065),inset 0 0 0 1px rgba(143,139,235,.05)}
details,.trendsum{background:rgba(255,255,255,.72);border-color:rgba(120,130,214,.18);
  border-radius:18px}
.pb::before,.evc::before{background:var(--accent)}
.ev{background:rgba(255,255,255,.64);border-radius:12px}
.chip,.kw,.hz,.imp,.tbc,.axword,.plain{border-radius:var(--radius-pill)}
.kw{background:rgba(77,98,255,.10);color:#3a4bd0;font-weight:700}
.plain{background:rgba(255,255,255,.72);border:1px solid rgba(120,130,214,.18);
  border-radius:18px}
.bar{background:rgba(100,115,180,.14);border-radius:var(--radius-pill)}
.bar i{border-radius:inherit}
footer{border:0;margin:22px 6px 0;padding:16px 20px;border-radius:18px;
  background:rgba(255,255,255,.6);border:1px solid rgba(120,130,214,.16);color:#4a5878}
#top{background:#5263ed;box-shadow:0 9px 24px rgba(123,97,255,.28)}
.fchip,.co-b,.cmp-preset,.wpick,.zoombtn,.cmp-more,.cmppanel-x,.lb-x,.wrow-t{
  border-radius:var(--radius-pill);background:rgba(255,255,255,.74)}
.cmppanel{border-radius:20px}
.wrow{background:transparent}
.nochart{background:rgba(120,130,214,.09);border-radius:18px}

/* ── Hero（.brief）→ 海香菇 hero-panel ── */
.brief{border-radius:46px 72px 46px 46px;border:1px solid rgba(255,255,255,.97);
  background-color:rgba(245,235,255,.88);
  background-image:
    radial-gradient(circle at 79% 16%,rgba(81,144,255,.32),transparent 34%),
    radial-gradient(circle at 72% 86%,rgba(255,111,201,.25),transparent 39%),
    linear-gradient(137deg,rgba(255,255,255,.92),rgba(245,235,255,.79) 50%,rgba(222,240,255,.76));
  box-shadow:0 14px 44px rgba(106,91,198,.105),inset 0 0 0 1px rgba(128,139,255,.07),
    inset 0 18px 58px rgba(255,255,255,.34)}
.brief-mast{background:rgba(255,255,255,.62);border-bottom:1px solid rgba(120,130,214,.14);
  border-radius:46px 72px 0 0;padding:10px 30px}
.brief-mast .mt{color:#253668}
.brief-mast .mn{color:#55628a}
/* 底紋層已在上方的 .brief-fx .pat 直接換成海香菇 hero 圖（位置、遮罩與視差
   參數沿用第 9 輪），等於讓滑鼠視差直接推動海香菇，而非另疊一層裝飾。
   此處只調不透明度。 */
.brief-fx .pat{opacity:.62}
.brief-fx .dots{background-image:radial-gradient(rgba(86,104,255,.22) 1px,transparent 1px)}
.brief-fx .glow{background:radial-gradient(260px circle at var(--mx,-999px) var(--my,-999px),
  rgba(123,97,255,.08),rgba(123,97,255,0) 70%)}
.scen-en{color:#173da7;font-weight:900;letter-spacing:-.055em}
.scen-zh{color:#29356f;font-weight:850}
.verdict{color:#3e4a6b}
/* Snapshot 面板 → decision-summary 的淺玻璃 */
.snap{background-color:rgba(255,255,255,.84);
  background-image:linear-gradient(180deg,rgba(255,255,255,.84),rgba(255,248,253,.71));
  border-left:1px solid rgba(120,130,214,.12);color:#253668;border-radius:0 72px 46px 0}
.snap h3{color:#253668;font-weight:850}
.sr-row{border-top-color:rgba(112,120,185,.12)}
.sr-k{color:#55628a}
.sr-v{color:#253668}
.sr-v .sm{color:#3e4a6b}
.snap .note{border-top-color:rgba(112,120,185,.12);color:#55628a}
/* 行動建議帶 → action-strip */
.actband{border-radius:38px;background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.9)}
.actband-h{background:transparent;border-bottom:1px solid rgba(120,130,214,.12);
  border-radius:38px 38px 0 0}
.actband-h b{color:#354976;font-weight:850}
.act{border-left-color:rgba(120,130,214,.12)}
.actband-f{background:transparent;border-top-color:rgba(120,130,214,.12)}

/* ── 響應式：對齊 V3.3 的 1180／880／540 三個斷點 ── */
@media(max-width:1180px){
  .product-frame{grid-template-columns:196px minmax(0,1fr)}
}
@media(max-width:1099px){
  /* 舊模板在此寬度以下把 header 變回橫向黏性列；本層維持側欄直到 880px，
     兩者衝突處在此一次覆蓋掉 */
  header{position:sticky;top:12px;flex-direction:column}
  .secnav a .ni{display:inline}
}
@media(max-width:880px){
  .product-frame{display:block;width:min(100% - 12px,860px);margin:6px auto;padding:5px;
    border-radius:29px}
  header{position:static;max-height:none;display:block;padding:8px;border-radius:23px}
  .hd{display:contents}
  .brand{min-height:0;padding:0 5px 7px}
  .brand-emblem{width:43px;height:47px}
  .vtoggle{margin:0 0 8px;width:max-content}
  .wnav{margin:0 0 8px}
  #wsel{flex:1 1 auto;margin-bottom:0}
  nav.secnav{border-top:0;margin-top:4px;padding-top:0}
  .secnav .wrap{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px}
  .secnav a{flex:0 0 auto;min-height:34px;padding:6px 12px}
  .secnav a:hover{transform:none}
  .nh{display:none}
  .stat{margin:8px 0 0;padding:8px 4px 2px}
  .topbar{min-height:45px;padding-inline:4px}
  .top-tools{display:none}
  .corner-habitat{display:none}
  .brief-mast,.snap{border-radius:0}
  .brief{border-radius:33px}
  .actband{border-radius:24px}
}
@media(max-width:540px){
  .product-frame{border-radius:22px}
  /* ⚠ 不可用 display:none：.tb 的可讀名稱只有 .tb-l（.tb-h 已全域隱藏，
     編號圓圈是 ::before 的 CSS counter、不進無障礙樹），一藏就變成
     五個沒有名稱的按鈕。改視覺隱藏，輔助科技仍讀得到「總覽／公司／…」。 */
  .tb .tb-l{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);
    white-space:nowrap}
  .brief{border-radius:26px}
}
/* 舊模板 ≤600px 的 header 雙行規則已被本層的側欄／堆疊佈局取代 */
@media(max-width:600px){
  .hd{height:auto;padding:0}
  .brand{flex:1 1 auto;min-width:0}
  .wnav{flex:1 1 auto}
}
/* ── Decision Trace 加總驗算 ── */
.tsum{margin-top:14px;padding:14px 18px;border-radius:18px;
  background:rgba(255,255,255,.72);border:1px solid rgba(120,130,214,.18);
  border-left:3px solid var(--accent)}
.tsum.bad{border-left-color:var(--err)}
.tsum>b{font-size:12.5px;color:var(--ink)}
.tsum-q{font-size:11.5px;color:var(--ink2);margin-left:10px}
.tsum-t{width:auto;margin-top:9px;border-collapse:collapse;font-size:12px}
.tsum-t td{padding:4px 18px 4px 0;border-bottom:1px solid rgba(120,130,214,.12);color:var(--ink2)}
.tsum-t td.num{font-family:"IBM Plex Mono","Noto Sans TC",monospace;
  font-variant-numeric:tabular-nums;text-align:right;padding-right:0;min-width:64px}
.tsum-t tr.cur td{font-weight:700;color:var(--ink);border-bottom:none}
.tsum-n{margin:9px 0 0;font-size:11px;color:var(--muted);line-height:1.7}
.tsum.bad .tsum-n{color:var(--err);font-weight:600}
@media(max-width:600px){.tsum-q{display:block;margin:4px 0 0}}

/* ── 現場判定 ── */
.jd{margin-top:14px}
.jd-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:11px}
.jd-h b{font-size:13.5px}
.jd-q{font-size:12.5px;color:var(--ink2)}
.jd-tag{margin-left:auto;font-size:9.5px;letter-spacing:.04em;padding:2px 9px;border-radius:999px;
  background:rgba(176,16,106,.08);color:var(--err);border:1px solid rgba(176,16,106,.26);font-weight:700}
.jd-in{display:grid;gap:8px;margin-bottom:11px}
.jd-in select{max-width:none;width:100%}
.jd-in textarea{width:100%;font-family:inherit;font-size:12px;line-height:1.7;color:var(--ink);
  padding:10px 12px;border:1px solid var(--line2);border-radius:14px;background:rgba(255,255,255,.8);resize:vertical}
.jd-in textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.jd-in button{justify-self:start}
.jd-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.jd-col h4{margin:0 0 6px;font-size:11.5px;font-weight:800;color:var(--ink)}
.jd-pre{margin:0;padding:11px 13px;border-radius:14px;white-space:pre-wrap;word-break:break-word;
  font-family:inherit;font-size:11.5px;line-height:1.8;color:var(--ink2);
  background:rgba(255,255,255,.72);border:1px solid rgba(120,130,214,.18)}
.jd-meta{margin-top:6px;font-size:10.5px;color:var(--muted);line-height:1.65}
.jd-wait{font-size:12px;color:var(--muted)}
.jd-err{font-size:11.5px;color:var(--err);line-height:1.7}
.jd-note{margin:11px 0 0;font-size:11px;color:var(--muted);line-height:1.75}
.jd-note b{color:var(--ink2)}
@media(max-width:820px){.jd-cols{grid-template-columns:1fr}.jd-tag{margin-left:0}}

/* ── 規則模擬器 ── */
.sim{margin-top:14px}
.sim-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:11px}
.sim-h b{font-size:13.5px}

/* ── 決賽投影：1280×720 的首屏緊縮 ────────────────────────────────────
   決賽現場投影為 720p。實測總覽分頁的「本週行動建議」帶底緣落在 727px
   （W5/W8/W9/W10）與 750px（W6/W7，情境敘述較長使封面高 403px），
   摺線 720 會把整條行動建議帶切掉——而那正是評審最該看到的一段。
   最差需回收 30px；此處收 35px 留餘裕。
   用 max-height 而非全域縮排：只在垂直空間真的不足時才緊縮，
   一般螢幕的呼吸感完全不動。min-width 限定側欄版型，窄版本來就是捲的。 */
@media (min-width:1100px) and (max-height:780px){
  .product-frame{margin-top:8px}      /* −4 */
  .topbar{min-height:42px}            /* −7 */
  /* .hero 不可省：總覽區段是 <section class="hero" id="overview">，
     而 .hero{padding-top:22px} 的特異性 (0,1,0) 壓過 section (0,0,1)，
     與先後順序無關——只寫 section 那條完全不會生效（實測仍是 22px）。 */
  section,.hero{padding-top:10px}     /* −12 */
  .actband{margin-top:8px}            /* −6 */
  .brief-main{padding-top:13px;padding-bottom:11px}   /* −20（原 −14，字級放大後再回收 6）*/
  .actband-h{padding-top:7px;padding-bottom:7px}      /* −10（原 −6，同上再回收 4）*/

  /* ── 720p 投影可讀性：摺線之上的字級 ──
     決賽投影 1280×720。摺線上方原有 44 個文字元素小於 12px，最小 9.5px。
     ⚠ 字級與摺線是對立的：每放大 1px 就吃掉餘裕，而 W6/W7 只剩 23px。
        因此分成兩類處理，不是一律放大：
        ① 不在主欄垂直鏈上的（側欄、頂列固定高）——放大不吃摺線，可放心加
        ② 在主欄垂直鏈上的（masthead／讀數面板／行動帶）——放大要付帳，
           在下方以等量內距回收
        裝飾性文字（§編號 .ix）與免責聲明（.note／不確定性聲明）刻意不動：
        評審不需要從投影上讀它們，放大它們等於拿摺線去換沒人看的字。 */

  /* ① 免費區：側欄與頂列 */
  .bs{font-size:11px}                    /* 9.7 → 11　品牌副標 */
  .secnav a .ni{font-size:11px}          /* 9.5 → 11　區段編號 */
  .nh{font-size:11px}                    /* 9.5 → 11　區段提示（全站最小者） */
  .tb .tb-l{font-size:12px}              /* 11 → 12　分頁標籤，topbar 有固定 min-height */

  /* ② 付費區：主欄垂直鏈 */
  .brief-mast .mn{font-size:12.5px}      /* 11 → 12.5　週次與日期 */
  .sr-k{font-size:12px}                  /* 11 → 12　讀數面板標籤 ×6 */
  .sr-v .sm{font-size:12.5px}            /* 11 → 12.5　情境名稱 */
  .snap h3{font-size:12.5px}             /* 11.5 → 12.5　決策摘要標題 */
  .axword{font-size:11.5px}              /* 10.5 → 11.5　雙軸判讀詞 */
  .delta{font-size:11.5px}               /* 10.5 → 11.5　位移數 */
  .actband-f{font-size:12.5px}           /* 11.5 → 12.5　前三大 KDF */
  .brief-mast .chip{font-size:11.5px}    /* 10.5 → 11.5　【推斷】誠實標記 */
  .ax-f{font-size:11px}                  /* 10 → 11　雙軸端點刻度（碎裂 −1／聚合 +1）*/
  .act b{font-size:11px}                 /* 10 → 11　該做／停損 標籤 */

  /* ③ 回收：付上面那筆帳（實測後定值，見 commit 訊息的逐週摺線表） */
  .actband-f{padding-top:6px;padding-bottom:6px}      /* −4 */
}

   線上版＝當前網址去掉 hash（不用 origin+pathname——file:// 時 origin 是字串 "null"，
   會複製出 null/C:/…#w8 這種壞連結）。
   離線版＝改用 og:url 的線上網址。離線檔走 file:// 時 location 是 file:///C:/Users/…，
   那種連結對收件者無用、且含使用者名稱；斷網情境下複製的意義本來就是「事後能打開」。
   og:url 是全站唯一一處線上網址，不在此另存一份。 */
const SITE_URL=((document.querySelector('meta[property="og:url"]')||{}).content||'').replace(/#.*$/,'');
if(IS_OFFLINE&&SITE_URL)$('#wcopy').title='複製本週連結（線上網址）';
$('#wcopy').onclick=async()=>{
  const base=(IS_OFFLINE&&SITE_URL)?SITE_URL:location.href.split('#')[0];
  const u=base+'#w'+DATA.weeks[cur].week;
  try{await navigator.clipboard.writeText(u);$('#wcopy').textContent='✓';setTimeout(()=>$('#wcopy').textContent='⧉',1200)}
  catch(e){prompt('複製此連結：',u)}};
/* 回頂：捲動後把焦點交給頁首，否則鍵盤使用者會停在即將隱藏的按鈕上 */
$('#top').onclick=()=>{scrollTo({top:0,behavior:'smooth'});
  const t=document.querySelector('header .brand')||document.body;
  t.setAttribute('tabindex','-1');t.focus({preventScroll:true})};
$('#wprint').onclick=()=>print();
function setView(v){if(view===v)return;view=v;
  document.body.classList.toggle('vs',v==='simple');
  $('#vsimple').classList.toggle('on',v==='simple');
  $('#vfull').classList.toggle('on',v==='full');
  render(cur);}
document.body.classList.toggle('vs',view==='simple');
$('#vsimple').onclick=()=>setView('simple');
$('#vfull').onclick=()=>setView('full');

/* ── 對話框焦點管理 ──
   兩個 role="dialog" aria-modal="true" 先前只切換 hidden：不移入焦點、
   不困住 Tab、背景未 inert、關閉也不還原焦點，鍵盤使用者會被留在被遮蔽的
   觸發鈕上，Tab 還會走到覆蓋層背後的控制項。以堆疊管理（放大檢視中點資料點
   會再開週次講解，兩層並存），inert 為主、Tab 陷阱為備援不依賴 inert 支援度。 */
const modalStack=[];
/* .skip 也要納入：它在 header 之外，漏掉的話 aria-modal 期間
   輔助科技仍能直接聚焦背景連結 */
const BG_SEL='header,nav.secnav,#main,footer,#top,.skip,#aifab,#aipanel';
const FOCUSABLE='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
/* position:fixed 元素的 offsetParent 為 null，故以 getClientRects 判可見 */
const focusablesIn=el=>[...el.querySelectorAll(FOCUSABLE)].filter(n=>n.getClientRects().length>0);
const setInert=(el,on)=>{if(el)on?el.setAttribute('inert',''):el.removeAttribute('inert')};
function focusInto(el){const f=focusablesIn(el);(f[0]||el).focus({preventScroll:true})}
function openModal(id){
  const el=$('#'+id);if(!el||modalStack.some(m=>m.id===id))return;
  modalStack.push({id,opener:document.activeElement});
  el.hidden=false;el.removeAttribute('inert');
  document.body.style.overflow='hidden';
  $$(BG_SEL).forEach(n=>setInert(n,true));
  modalStack.slice(0,-1).forEach(m=>setInert($('#'+m.id),true));  /* 只有最上層可互動 */
  focusInto(el);
}
function closeModal(id){
  const i=modalStack.findIndex(m=>m.id===id);if(i<0)return;
  const [rec]=modalStack.splice(i,1);
  const el=$('#'+id);el.hidden=true;el.removeAttribute('inert');
  if(modalStack.length){
    const top=$('#'+modalStack[modalStack.length-1].id);
    setInert(top,false);focusInto(top);
  }else{
    $$(BG_SEL).forEach(n=>setInert(n,false));
    document.body.style.overflow='';
    if(rec.opener&&rec.opener.isConnected)rec.opener.focus({preventScroll:true});
  }
}
/* Tab 陷阱：inert 已能擋住背景，此處另保最上層對話框內的循環，兩者互為備援 */
addEventListener('keydown',e=>{
  if(e.key!=='Tab'||!modalStack.length)return;
  const el=$('#'+modalStack[modalStack.length-1].id);
  const f=focusablesIn(el);
  if(!f.length){e.preventDefault();el.focus({preventScroll:true});return}
  const first=f[0],last=f[f.length-1];
  if(!el.contains(document.activeElement)){e.preventDefault();first.focus({preventScroll:true})}
  else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus({preventScroll:true})}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus({preventScroll:true})}
},true);

/* ── 放大檢視（功能一） ── */
function openLB(kind){
  if(typeof Chart==='undefined')return;   /* 第二道：避免任何殘留的觸發路徑開出空白對話框 */
  if((kind==='cmpxy'||kind==='cmpk')&&(!cmpA.size||!cmpB.size))return;
  openModal('lightbox');
  lbChart&&lbChart.destroy();
  if(kind==='xy')lbChart=drawXY(cur,$('#lbcv'));
  else if(kind==='trend')lbChart=drawTrend(cur,$('#lbcv'));
  else{const A=avgOf(cmpA),B=avgOf(cmpB);
    /* 放大時 Δ KDF 一律顯示全部 25 項（2026-08-08 確認） */
    lbChart=kind==='cmpxy'?drawCmpXY(A,B,$('#lbcv')):drawCmpK(A,B,$('#lbcv'),true);}
}
function closeLB(){
  if($('#lightbox').hidden)return;
  closeModal('lightbox');
  lbChart&&lbChart.destroy();lbChart=null;
}
$('#lbclose').onclick=closeLB;
$('#lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox')closeLB()});

/* ── 週次講解（功能二）：內容全取自該週既有資料 ── */
function showWeekPop(k){
  popIdx=k;const wk=DATA.weeks[k];
  const first=(clean(wk.scenarioDesc||'').replace(/^結論[：:]\s*/,'').split('。')[0]||'')+'。';
  const firedN=wk.companyPlan?wk.companyPlan.firedPlaybooks.length:0;
  $('#wpbody').innerHTML=`<div class="wp-t">W${wk.week}<span>${wk.range}</span></div>
    <div class="wp-s">${wk.scenarioEn||''}｜${wk.scenario}</div>
    <div class="wp-xy num">X ${fmt(wk.xy.x)}（${xWord(wk.xy.x)}）　Y ${fmt(wk.xy.y)}（${yWord(wk.xy.y)}）</div>
    <p class="wp-p">${first}</p>
    <div class="wp-m">觸發劇本 ${firedN} 條${wk.support?`｜支撐 ${wk.support.events} 則`:''}｜完整內容含事件、決策軌跡與規畫</div>`;
  $('#wpgo').textContent=`跳轉到 W${wk.week}`;
  openModal('weekpop');
}
const closeWeekPop=()=>closeModal('weekpop');
$('#wpclose').onclick=closeWeekPop;
$('#weekpop').addEventListener('click',e=>{if(e.target.id==='weekpop')closeWeekPop()});
$('#wpgo').onclick=()=>{closeWeekPop();closeLB();go(popIdx)};
addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(!$('#weekpop').hidden){closeWeekPop()}
  else if(!$('#lightbox').hidden){closeLB()}
  else if(cmpOpen){const side=cmpOpen;cmpOpen=null;cmpPend=null;cmpQuery='';buildCmp();focusPick(side)}
});

/* ── 週次對比（功能三）：A/B 自由勾選，多週取算術平均 ── */
function avgOf(set){
  const ws=[...set].sort((a,b)=>a-b).map(k=>DATA.weeks[k]);
  const n=ws.length;
  return {n,
    x:ws.reduce((s,w)=>s+w.xy.x,0)/n,
    y:ws.reduce((s,w)=>s+w.xy.y,0)/n,
    w:DATA.kdf.map((_,j)=>ws.reduce((s,w)=>s+w.w[j],0)/n),
    label:n===1?`W${ws[0].week}`:`${ws.map(w=>'W'+w.week).join('+')} 平均`};
}
function drawCmpXY(A,B,cv){
  const mkpts=set=>[...set].sort((a,b)=>a-b).map(k=>({x:DATA.weeks[k].xy.x,y:DATA.weeks[k].xy.y,l:'W'+DATA.weeks[k].week}));
  return new Chart(cv||$('#cmpxy'),{type:'scatter',data:{datasets:[
    {label:'A 各週',data:mkpts(cmpA),pointRadius:4,pointBackgroundColor:'#3f55ff',pointBorderColor:'#fff',pointBorderWidth:1},
    {label:'B 各週',data:mkpts(cmpB),pointRadius:4,pointBackgroundColor:'#4453d6',pointBorderColor:'#fff',pointBorderWidth:1},
    {label:'A 平均',data:[{x:A.x,y:A.y,l:'A 平均'}],pointRadius:9,pointStyle:'rectRot',pointBackgroundColor:'#3f55ff'},
    {label:'B 平均',data:[{x:B.x,y:B.y,l:'B 平均'}],pointRadius:9,pointStyle:'rectRot',pointBackgroundColor:'#4453d6'}]},
    options:{maintainAspectRatio:false,animation:{duration:300},
      plugins:{legend:{position:'bottom',labels:{boxWidth:8,usePointStyle:true,font:{size:10.5},color:'#3e4a6b',padding:10}},
        tooltip:{callbacks:{label:c=>`${c.raw.l||c.dataset.label}（${c.raw.x.toFixed(2)}, ${c.raw.y.toFixed(2)}）`}}},
      scales:{x:{min:-1,max:1,grid:{color:'#e4e7f7'},ticks:{color:'#55628a',font:{size:10}}},
        y:{min:-1,max:1,grid:{color:'#e4e7f7'},ticks:{color:'#55628a',font:{size:10}}}}}});
}
function drawCmpK(A,B,cv,full){
  const deltas=DATA.kdf.map((k,j)=>({id:k.id,name:k.name,d:B.w[j]-A.w[j]})).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
  const show=full?deltas:deltas.slice(0,10);
  return new Chart(cv||$('#cmpk'),{type:'bar',
    data:{labels:show.map(x=>x.id+'. '+x.name),datasets:[{data:show.map(x=>+x.d.toFixed(1)),
      backgroundColor:show.map(x=>x.d>=0?'#0d6c86':'#b0106a'),borderRadius:3,barPercentage:.72}]},
    options:{indexAxis:'y',maintainAspectRatio:false,animation:{duration:300},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`Δ ${c.raw>0?'+':''}${c.raw}`}}},
      scales:{x:{grid:{color:'#e4e7f7'},ticks:{color:'#55628a',font:{size:10}}},
        y:{grid:{display:false},ticks:{color:'#3e4a6b',font:{size:10}}}}}});
}
/* 面板關閉後 #cmpui 會整個重建，原本被聚焦的元素隨之消失、焦點掉回文件開頭。
   關閉的四條路徑（Esc／✕／再點同一顆／選定結束週）一律把焦點交還該側按鈕。 */
function focusPick(side){
  if(!side)return;
  const b=document.querySelector(`#cmpui .wpick[data-side="${side}"]`);
  if(b)b.focus({preventScroll:true});
}
/* 面板列表單獨抽出，供搜尋時做局部更新。
   輸入時若重建整個 #cmpui，使用者正在輸入的 <input> 會被一併換掉——中文 IME
   （注音／拼音／倉頡）組字中的第一個 input 事件就會讓組字目標消失，造成組字
   取消或提前上字。改為只替換列表，輸入框自始至終是同一個節點。 */
function cmpRowsHTML(){
  if(!cmpOpen)return '';
  const q=cmpQuery.trim().toLowerCase();
  const rows=DATA.weeks.map((w,k)=>({w,k}))
    .filter(({w})=>!q||[`w${w.week}`,String(w.week),w.range,w.scenario||'',w.scenarioEn||'']
      .join(' ').toLowerCase().includes(q));
  const sel=cmpSel[cmpOpen],pick=sel.mode==='pick';
  const cur=selSet(sel);
  const lo=pick?null:(cmpPend!==null?cmpPend:null);
  return rows.length?rows.map(({w,k})=>{
    const inCur=cur.has(k),isLo=lo===k;
    return `<button type="button" class="wrow${inCur?' in':''}${isLo?' lo':''}" data-k="${k}"
      role="option" aria-selected="${inCur}">
      ${pick?`<span class="wrow-cb" aria-hidden="true">${inCur?'✓':''}</span>`:''}
      <span class="wrow-w num">W${w.week}</span>
      <span class="wrow-r num">${w.range}</span>
      <span class="wrow-s">${w.scenarioEn||w.scenario||''}</span>
      ${isLo?'<span class="wrow-t">起始</span>':(inCur&&!pick)?'<span class="wrow-t on">已選</span>':''}
    </button>`}).join(''):'<div class="cmppanel-e">找不到符合的週次，請換個關鍵字。</div>';
}
function buildCmp(){
  cmpCharts.forEach(c=>c.destroy());cmpCharts=[];
  const box=$('#cmpui');if(!box)return;
  cmpA=selSet(cmpSel.a);cmpB=selSet(cmpSel.b);
  const pickBtn=side=>{const r=cmpSel[side],n=selSet(r).size;
    return `<button type="button" class="wpick${cmpOpen===side?' on':''}" data-side="${side}"
      aria-expanded="${cmpOpen===side}" aria-controls="cmppanel">
      <span class="wpick-v num">${selLabel(r)}</span>
      <span class="wpick-n">${(d=>d?`${n} 期・${d} 天`:(n===1?'單週':`共 ${n} 週`))(selDays(r))}</span>
      <span class="wpick-c" aria-hidden="true">${cmpOpen===side?'−':'＋'}</span></button>`};
  /* 選擇面板：區間模式＝點起始再點結束、中間自動納入；自由勾選模式＝逐週切換。
     附搜尋以免週次過多難找。 */
  let panel='';
  if(cmpOpen){
    const pick=cmpSel[cmpOpen].mode==='pick';
    const hint=pick?`逐週點選切換，可非連續（已選 ${selSet(cmpSel[cmpOpen]).size} 週）`
      :(cmpPend===null?'點第一次＝起始週':`已選起始 W${DATA.weeks[cmpPend].week}，再點一次＝結束週`);
    panel=`<div class="cmppanel" id="cmppanel">
      <div class="cmppanel-h">
        <b>${cmpOpen==='a'?'基準 A':'對比 B'}</b>
        <div class="cmpmode" role="group" aria-label="選擇方式">
          <button type="button" class="cmpmode-b${pick?'':' on'}" data-mode="range" aria-pressed="${!pick}">區間</button>
          <button type="button" class="cmpmode-b${pick?' on':''}" data-mode="pick" aria-pressed="${pick}">自由勾選</button>
        </div>
        <span class="cmppanel-hint">${hint}</span>
        <span class="sp"></span>
        <button type="button" class="cmppanel-x" id="cmpclose" aria-label="關閉選擇面板">✕</button>
      </div>
      <input type="search" class="cmppanel-q" id="cmpq" value="${cmpQuery.replace(/"/g,'&quot;')}"
        placeholder="搜尋週次、日期或情境（例：W5、07/14、Crossroads）" aria-label="搜尋週次">
      <div class="cmppanel-l" role="listbox" aria-multiselectable="true">${cmpRowsHTML()}</div>
    </div>`;
  }
  const n=DATA.weeks.length;
  const presets=CMP_PRESETS.filter(p=>p.fn(n)).map(p=>
    `<button type="button" class="cmp-preset" data-p="${p.k}">${p.label}</button>`).join('');
  let html=`${presets?`<div class="cmp-presets"><span class="cmp-presets-l">快捷</span>${presets}</div>`:''}
  <div class="cmp-rows">
    <div class="cmp-row"><span class="cmp-lab a">基準 A</span>${pickBtn('a')}</div>
    <div class="cmp-row"><span class="cmp-lab b">對比 B</span>${pickBtn('b')}</div>
  </div>${panel}`;
  /* 期數不等於天數：僅在選取範圍含非 7 天期別時提示，八週等長時完全不出現。
     避免把「N 期平均」誤讀為按時間加權。 */
  const odd=[...new Set([...cmpA,...cmpB])].map(k=>DATA.weeks[k])
    .filter(w=>w&&w.days&&w.days!==7);
  if(odd.length)html+=`<div class="cmpnote">本次比較含非 7 天期別（${odd.map(w=>`W${w.week} ${w.days} 天`).join('、')}）；
    多期平均為<b>每期等權</b>，不依天數加權。</div>`;
  if(!cmpA.size||!cmpB.size){
    box.innerHTML=html+`<div class="cmp-line" style="color:var(--muted)">A、B 兩側各至少勾選一週即可比較。</div>`;
  }else{
    const A=avgOf(cmpA),B=avgOf(cmpB);
    const dx=B.x-A.x,dy=B.y-A.y;
    const dims=DATA.dims.map(d=>({n:d.name,a:dimAvg(A.w,d),b:dimAvg(B.w,d)}));
    html+=`<div class="cmp-line"><b style="color:var(--c1)">${A.label}</b><span class="num">（X ${fmt(A.x)}／Y ${fmt(A.y)}）</span> →
      <b style="color:var(--accent)">${B.label}</b><span class="num">（X ${fmt(B.x)}／Y ${fmt(B.y)}）</span>：
      X ${dx<0?'碎裂加深':dx>0?'聚合改善':'持平'} <b class="num">${Math.abs(dx).toFixed(2)}</b>、
      Y ${dy<0?'充沛收斂':dy>0?'充沛回升':'持平'} <b class="num">${Math.abs(dy).toFixed(2)}</b></div>
    <div class="cmp-g">
      <div class="cmp-cell"><button type="button" class="zoombtn" data-zoom="cmpxy" aria-label="放大 A/B 落點圖">⤢ 放大</button>
        <div class="cbox" style="height:280px"><canvas id="cmpxy"></canvas></div>
        <div class="cap">A（藍）、B（橘）各週落點；菱形大點＝該側平均。</div></div>
      <div class="cmp-cell"><button type="button" class="zoombtn" data-zoom="cmpk" aria-label="放大 Δ KDF 圖">⤢ 放大</button>
        <div class="cbox" style="height:${cmpFull?560:280}px"><canvas id="cmpk"></canvas></div>
        <div class="cap">Δ KDF＝B 平均 − A 平均，依變動幅度排序${cmpFull?'（全部 25 項）':'（前 10 項）'}；放大檢視固定顯示全部 25 項。</div>
        <button class="cmp-more" id="cmpmore">${cmpFull?'只看前 10 項':'展開全部 25 項'}</button></div>
    </div>
    <div style="overflow-x:auto;margin-top:14px"><table>
      <thead><tr><th>五大維度</th><th>A 平均</th><th>B 平均</th><th>Δ</th></tr></thead>
      <tbody>${dims.map(d=>{const dd=d.b-d.a;
        return `<tr><td>${d.n}</td><td class="num">${d.a.toFixed(1)}</td><td class="num">${d.b.toFixed(1)}</td>
        <td class="num" style="color:${dd>0.05?'var(--ok)':dd<-0.05?'var(--err)':'inherit'}">${(dd>0?'+':'')+dd.toFixed(1)}</td></tr>`}).join('')}</tbody>
    </table></div>`;
    box.innerHTML=html;
    cmpCharts.push(drawCmpXY(A,B));
    cmpCharts.push(drawCmpK(A,B,null,cmpFull));
    $('#cmpmore').onclick=()=>{cmpFull=!cmpFull;buildCmp()};
    $$('#cmpui .zoombtn').forEach(b=>b.onclick=()=>openLB(b.dataset.zoom));
  }
  /* 兩顆側別按鈕：展開／收合選擇面板 */
  $$('#cmpui .wpick').forEach(b=>b.onclick=()=>{
    const side=b.dataset.side;
    cmpOpen=cmpOpen===side?null:side;
    cmpPend=null;cmpQuery='';
    buildCmp();
    if(cmpOpen)$('#cmpq')&&$('#cmpq').focus();
    else focusPick(side);
  });
  const closePanel=()=>{const side=cmpOpen;cmpOpen=null;cmpPend=null;cmpQuery='';buildCmp();focusPick(side)};
  $('#cmpclose')&&($('#cmpclose').onclick=closePanel);
  /* 週次列：第一次點＝起始，第二次點＝結束（順序顛倒也成立，取小到大）。
     局部更新後需重綁，故抽成函式。 */
  const bindRows=()=>$$('#cmpui .wrow').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k,s=cmpSel[cmpOpen];
    if(s.mode==='pick'){
      /* 自由勾選：逐週切換、面板保持開啟；至少保留一週，避免選成空集合而無法比較 */
      const ks=new Set(s.ks||[]);
      if(ks.has(k)){if(ks.size>1)ks.delete(k)}else ks.add(k);
      cmpSel[cmpOpen]={mode:'pick',ks:[...ks].sort((x,y)=>x-y)};
      buildCmp();
      /* 焦點留在剛切換的那一列，連續勾選不必每次從搜尋框重走一遍清單 */
      const back=document.querySelector(`#cmpui .wrow[data-k="${k}"]`);
      (back||$('#cmpq'))&&(back||$('#cmpq')).focus();
      return;
    }
    if(cmpPend===null){cmpPend=k;buildCmp();$('#cmpq')&&$('#cmpq').focus();return}
    const side=cmpOpen;
    cmpSel[cmpOpen]={mode:'range',s:Math.min(cmpPend,k),e:Math.max(cmpPend,k)};
    cmpOpen=null;cmpPend=null;cmpQuery='';
    buildCmp();focusPick(side);
  });
  bindRows();
  /* 模式切換：兩邊互轉都以目前選取為基礎，不清空使用者已選的週次。
     轉自由勾選＝以目前區間為初始勾選；轉區間＝取目前選取的首末為新區間。 */
  $$('#cmpui .cmpmode-b').forEach(b=>b.onclick=()=>{
    const m=b.dataset.mode,ks=[...selSet(cmpSel[cmpOpen])].sort((x,y)=>x-y);
    const first=ks.length?ks[0]:0,last=ks.length?ks[ks.length-1]:0;
    cmpSel[cmpOpen]=m==='pick'?{mode:'pick',ks:ks.length?ks:[0]}:{mode:'range',s:first,e:last};
    cmpPend=null;buildCmp();
    const nb=document.querySelector(`#cmpui .cmpmode-b[data-mode="${m}"]`);if(nb)nb.focus();
  });
  /* 快捷比較：一鍵設定 A/B 兩側並收合面板 */
  $$('#cmpui .cmp-preset').forEach(b=>b.onclick=()=>{
    const p=CMP_PRESETS.find(x=>x.k===b.dataset.p);if(!p)return;
    const v=p.fn(DATA.weeks.length);if(!v)return;
    cmpSel={a:v.a,b:v.b};cmpOpen=null;cmpPend=null;cmpQuery='';
    buildCmp();
    const nb=document.querySelector(`#cmpui .cmp-preset[data-p="${p.k}"]`);if(nb)nb.focus();
  });
  /* 搜尋：只替換列表，輸入框不重建——保住中文 IME 的組字目標，也不需要再
     復原游標與插入點。組字期間（compositionstart→end）不篩選，避免以未上字的
     注音符號去比對而顯示空結果，改於組字完成時一次套用。 */
  const qi=$('#cmpq');
  if(qi){
    let composing=false;
    const applyFilter=()=>{
      cmpQuery=qi.value;
      const list=$('#cmppanel .cmppanel-l');
      if(list){list.innerHTML=cmpRowsHTML();bindRows()}
    };
    qi.addEventListener('compositionstart',()=>{composing=true});
    qi.addEventListener('compositionend',()=>{composing=false;applyFilter()});
    qi.addEventListener('input',()=>{if(!composing)applyFilter()});
  }
}
function go(i){
  if(i<0||i>=DATA.weeks.length)return;
  cur=i;sel.value=i;
  try{history.replaceState(null,'','#w'+DATA.weeks[i].week)}catch(e){}

  setTimeout(()=>{render(i);m.classList.remove('fade');
    /* render 換掉整個 #main：若原焦點元素被銷毀（如週次講解的「跳轉到 W…」路徑），
       焦點會掉回 body；接手交給週次選單，鍵盤流程不中斷 */
