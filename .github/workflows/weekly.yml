name: SCAI-Agent Weekly Pipeline

on:
  schedule:
    # 每週一 00:00 UTC = 台北時間週一 08:00（GitHub cron 不保證準點，可能延遲數分鐘）
    - cron: "0 0 * * 1"
  workflow_dispatch: {}   # 決賽 Demo 用：手動觸發按鈕

permissions:
  contents: write         # 允許 workflow 把產出 commit 回倉庫

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets（未設齊則本次優雅跳過，設定後自動恢復）
        id: keys
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY:    ${{ secrets.TAVILY_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$GEMINI_API_KEY" ] || [ -z "$TAVILY_API_KEY" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::三把 API key Secrets 尚未設定齊全（ANTHROPIC/GEMINI/TAVILY），本次執行跳過"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.keys.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CJK fonts (圖表中文顯示)
        if: steps.keys.outputs.ok == 'true'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        if: steps.keys.outputs.ok == 'true'
        run: pip install -r requirements.txt

      - name: Run weekly pipeline
        if: steps.keys.outputs.ok == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY:    ${{ secrets.TAVILY_API_KEY }}
        run: |
          python src/fetch.py
          python src/pipeline.py
          python src/make_charts.py
          python src/build_site.py

      - name: Commit results (Observability 留痕)
        if: steps.keys.outputs.ok == 'true'
        run: |
          git config user.name  "scai-agent-bot"
          git config user.email "bot@scai-agent"
          git add data/ weekly/ charts/ reports/ dashboard/ docs/
          git diff --cached --quiet || git commit -m "chore(weekly): $(date -u +%F) 自動週報產出"
          git push
